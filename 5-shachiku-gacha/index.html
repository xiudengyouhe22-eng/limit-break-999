<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
var LS_BEST="shachiku_best_v1", LS_MUTE="shachiku_mute_v1";

/* ---------------- audio ---------------- */
var AU={ctx:null,master:null,muted:false};
try{ AU.muted=localStorage.getItem(LS_MUTE)==="1"; }catch(e){}
function audioInit(){
  if(AU.ctx) return;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ AU.ctx=new AC(); AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:0.5; AU.master.connect(AU.ctx.destination);}catch(e){AU.ctx=null;}
}
function audioResume(){ audioInit(); if(AU.ctx&&AU.ctx.state==="suspended"){try{AU.ctx.resume()}catch(e){}} }
function nowT(){return AU.ctx?AU.ctx.currentTime:0}
function tone(o){
  if(!AU.ctx||AU.muted) return;
  var t0=nowT()+(o.delay||0),osc=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  osc.type=o.type||"sine"; osc.frequency.setValueAtTime(Math.max(20,o.f||440),t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+(o.dur||0.2));
  var v=o.v==null?0.16:o.v;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(o.dur||0.2));
  osc.connect(g); g.connect(AU.master); osc.start(t0); osc.stop(t0+(o.dur||0.2)+0.05);
}
function noiseBurst(o){
  if(!AU.ctx||AU.muted) return;
  var dur=o.dur||0.2,t0=nowT()+(o.delay||0);
  var len=Math.floor(AU.ctx.sampleRate*dur),buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,o.pow||2);
  var src=AU.ctx.createBufferSource(); src.buffer=buf;
  var f=AU.ctx.createBiquadFilter(); f.type=o.type||"lowpass"; f.frequency.setValueAtTime(o.f||1200,t0);
  if(o.fTo) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.fTo),t0+dur);
  var g=AU.ctx.createGain(); g.gain.setValueAtTime(o.v==null?0.2:o.v,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(AU.master); src.start(t0); src.stop(t0+dur+0.02);
}
function sfxReel(){ for(var i=0;i<3;i++) tone({type:"square",f:900-i*120,dur:0.03,v:0.05,delay:i*0.05}); }
function sfxStop(){ tone({type:"square",f:700,to:1200,dur:0.07,v:0.09}); noiseBurst({dur:0.12,f:2000,fTo:600,v:0.1}); }
function sfxRare(){
  tone({type:"triangle",f:1200,to:2400,dur:0.5,v:0.15});
  tone({type:"sine",f:1600,dur:0.5,v:0.10,delay:0.05});
  tone({type:"sine",f:2400,dur:0.6,v:0.08,delay:0.12});
  noiseBurst({dur:0.6,f:6000,fTo:1200,type:"bandpass",v:0.09});
}
function sfxSuper(){
  "1357".split("").forEach(function(c,i){ tone({type:"square",f:523*Math.pow(2,i/12*3),dur:0.18,v:0.10,delay:i*0.055}); });
  tone({type:"sawtooth",f:220,to:2200,dur:0.6,v:0.12});
  noiseBurst({dur:0.9,f:400,fTo:9000,type:"highpass",v:0.14});
}
function sfxWin(){
  [523,659,784,1046,1318].forEach(function(f,i){ tone({type:"triangle",f:f,dur:0.24,v:0.12,delay:i*0.085}); });
  noiseBurst({dur:0.7,f:5000,fTo:9000,type:"highpass",v:0.08});
}

/* ---------------- data ---------------- */
/* tier: 1=ありふれ / 2=普通 / 3=やや珍 / 4=レア / 5=激レア / 6=虹 */
var SLOTS=[
  {key:"配属先", items:[
    ["営業一課",1],["経理部 経理課",1],["総務部 総務課",1],["情報システム部",2],["人事部 採用担当",2],
    ["広報部",2],["物流センター",2],["カスタマーサポート",3],["地方支社 営業所",3],["役員付き秘書室",3],
    ["業務改善推進室（閑職）",4],["新規事業開発部（予算なし）",4],["関連会社への出向",4],
    ["子会社の子会社",5],["本社の倉庫（通称：牢屋）",5],["社長の自宅兼事務所",6],["グループ会社の解散準備室",6]
  ]},
  {key:"初任給", items:[
    ["月18万円",1],["月20万円",1],["月21万円",2],["月22万円",2],["月24万円",2],["月26万円",3],
    ["月28万円",3],["月30万円",4],["月35万円",4],["月40万円（ただしみなし残業80h）",5],
    ["月12万円（研修名目）",5],["月8万円＋夢",6],["月0円（株券支給）",6]
  ]},
  {key:"上司", items:[
    ["昭和の体育会系部長",1],["無口な課長",1],["話が長い専務",2],["数字しか見ない本部長",2],
    ["定時で帰る先輩",3],["謎の顧問",3],["毎日説教する社長",3],["無能だが優しい上司",4],
    ["般若のような女上司",4],["海外在住で連絡が取れない上司",5],["元ヤン課長（義理堅い）",5],["ほぼ幽霊",6]
  ]},
  {key:"残業時間", items:[
    ["月5時間",1],["月10時間",1],["月20時間",2],["月30時間",2],["月45時間",2],["月60時間",3],
    ["月80時間",3],["月100時間",4],["月120時間",4],["月150時間",5],["月200時間",5],["月300時間（産業医が泣いた）",6]
  ]},
  {key:"ボーナス", items:[
    ["年間2ヶ月",1],["年間3ヶ月",1],["年間4ヶ月",2],["年間5ヶ月",2],["年間6ヶ月",3],["年間8ヶ月",3],
    ["年間10ヶ月",4],["年間12ヶ月",4],["現物支給（米30kg）",5],["社長の似顔絵",5],["0.1ヶ月",5],["なし（業績悪化）",6]
  ]},
  {key:"退職理由", items:[
    ["転職",1],["家庭の事情",1],["寿退社",2],["人間関係",2],["給与未払い",3],["パワハラ",3],
    ["燃え尽き",4],["会社が消滅",4],["事業売却",4],["過労",5],["謎の失踪",5],["逮捕",5],["死亡（過労）",6]
  ]}
];
var TIER_N={1:3,2:8,3:25,4:120,5:1500,6:25000};
var TIER_W={1:40,2:26,3:14,4:6,5:1.6,6:0.35};
var TIER_NAME={1:"",2:"",3:"レア",4:"激レア",5:"超激レア",6:"虹確定"};

/* ---------------- state ---------------- */
var S={mode:"title",slot:0,results:[],denom:1,spinning:false,t:0,rareCount:0,rainbow:false};
var elLamps=Array.prototype.slice.call(document.querySelectorAll(".lamp"));
var elSlotLabel=$("#slotLabel"), elReelText=$("#reelText"), elReelSub=$("#reelSub");
var elHistory=$("#history"), elMainBtn=$("#mainBtn"), elCallout=$("#callout"), elFlash=$("#flash");
var scrTitle=$("#scrTitle"), scrResult=$("#scrResult");

/* ---------------- FX canvas ---------------- */
var fx=$("#fx"), fxc=fx.getContext("2d");
var W=360,H=640,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=fx.clientWidth||window.innerWidth; H=fx.clientHeight||window.innerHeight;
  fx.width=Math.round(W*DPR); fx.height=Math.round(H*DPR);
  fxc.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,120)});

var parts=[];
function spark(x,y,n,color,power){
  for(var i=0;i<n;i++){
    var a=rnd(0,6.2832),sp=rnd(80,620)*(power||1);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,
      life:rnd(0.4,1.1),max:1.1,size:rnd(1.5,4),color:color||"#ffd84a",g:520});
  }
}
function rain(n){
  for(var i=0;i<n;i++){
    parts.push({x:rnd(0,W),y:rnd(-H*0.3,0),vx:rnd(-40,40),vy:rnd(160,420),
      life:rnd(1.0,2.0),max:2.0,size:rnd(1.4,3.4),
      color:["#ff5ecb","#ffe95e","#5ee6ff","#b06bff","#ffffff"][ri(0,4)],g:120});
  }
}
function drawFx(dt){
  fxc.clearRect(0,0,W,H);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.vx*=Math.pow(0.4,dt);
    p.life-=dt;
    if(p.life<=0||p.y>H+20){ parts.splice(i,1); continue; }
    fxc.globalAlpha=clamp(p.life/0.7,0,1);
    fxc.fillStyle=p.color;
    fxc.fillRect(p.x,p.y,p.size,p.size*(1+Math.abs(p.vy)/400));
  }
  fxc.globalAlpha=1;
}

/* ---------------- flow ---------------- */
function startRun(){
  audioResume();
  S.mode="play"; S.slot=0; S.results=[]; S.denom=1; S.spinning=false; S.rareCount=0; S.rainbow=false;
  elHistory.innerHTML="";
  $("#liveRare").textContent="—"; $("#liveCount").textContent="0 / 6 抽選済み";
  elLamps.forEach(function(l){l.className="lamp"});
  elReelText.textContent="？？？"; elReelText.className="";
  elSlotLabel.textContent=SLOTS[0].key;
  elReelSub.textContent="タップで回す";
  elMainBtn.textContent="ガチャを回す"; elMainBtn.classList.remove("off");
  scrTitle.classList.add("hide"); scrResult.classList.add("hide");
  $("#machine").style.visibility="visible";
  parts.length=0;
  tone({type:"triangle",f:440,to:660,dur:0.2,v:0.12});
}
function pickItem(slot){
  var pool=slot.items;
  // weighted toward common
  var total=0, weights=pool.map(function(it){ return TIER_W[it[1]]||1; });
  weights.forEach(function(w){total+=w});
  var r=Math.random()*total;
  for(var i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0) return {text:pool[i][0],tier:pool[i][1]}; }
  return {text:pool[0][0],tier:pool[0][1]};
}
function spin(){
  if(S.mode!=="play"||S.spinning) return;
  if(S.slot>=SLOTS.length){ finishRun(); return; }
  audioResume();
  var slot=SLOTS[S.slot];
  var final=pickItem(slot);
  S.spinning=true;
  elCallout.classList.remove("show");   // 前回の演出文字を残さない
  elMainBtn.classList.add("off");
  elReelSub.textContent="抽選中…";
  elSlotLabel.textContent=slot.key;
  sfxReel();

  var t0=performance.now();
  var dur=520+Math.random()*260;
  var cycle=55;
  var last=0;
  var stopTick=function(){
    elReelText.className="";
    elReelText.textContent=final.text;
    elReelSub.textContent=TIER_NAME[final.tier]?TIER_NAME[final.tier]+"当選":"";
    // record
    S.results.push({key:slot.key,text:final.text,tier:final.tier});
    S.denom*=TIER_N[final.tier];
    addHistory(slot.key,final);
    elLamps[S.slot].className="lamp on";
    if(final.tier>=5){
      S.rareCount++;
      S.rainbow=true;
      elReelText.className="rainbow";
      elLamps[S.slot].className="lamp rainbow";
      sfxSuper();
      showCallout(final.tier===6?"虹確定":"超激アツ",TIER_NAME[final.tier]);
      elFlash.classList.remove("on"); void elFlash.offsetWidth; elFlash.classList.add("on");
      spark(W/2,H*0.34,50,"#ffd84a",1.3);
      rain(40);
    } else if(final.tier>=4){
      elReelText.className="gold";
      sfxRare();
      showCallout("激アツ","RARE");
      spark(W/2,H*0.34,26,"#ffe066",1);
    } else {
      sfxStop();
    }
    S.slot++;
    S.spinning=false;
    $("#liveRare").textContent=fmtDenom(Math.min(S.denom,1e9));
    $("#liveCount").textContent=S.slot+" / 6 抽選済み";
    if(S.slot>=SLOTS.length){
      elMainBtn.textContent="結果を見る ▶";
      elSlotLabel.textContent="FINISH";
      elReelSub.textContent="タップで査定へ";
      elMainBtn.classList.remove("off");
    } else {
      elMainBtn.textContent="次を回す";
      elMainBtn.classList.remove("off");
    }
  };
  var anim=function(ts){
    if(!S.spinning) return;
    if(ts-t0>=dur){ stopTick(); return; }
    if(ts-last>cycle){
      last=ts;
      var pool=slot.items;
      elReelText.className="spin";
      elReelText.textContent=pool[ri(0,pool.length-1)][0];
      if(Math.random()<0.35) sfxReel();
    }
    requestAnimationFrame(anim);
  };
  requestAnimationFrame(anim);
}
function addHistory(key,item){
  var row=document.createElement("div");
  row.className="hrow"+(item.tier>=4?" rare":"");
  row.innerHTML='<span class="k">'+key+'</span><span class="v">'+item.text+'</span>';
  elHistory.appendChild(row);
  if(elHistory.children.length>6){ elHistory.removeChild(elHistory.children[0]); }
}
function showCallout(a,b){
  var slot=document.getElementById("calloutSlot");
  if(slot){
    var r=slot.getBoundingClientRect();
    elCallout.style.top=r.top+"px";
    elCallout.style.height=r.height+"px";
  }
  elCallout.querySelector(".c1").textContent=a;
  elCallout.querySelector(".c2").textContent=b||"";
  elCallout.classList.remove("show"); void elCallout.offsetWidth; elCallout.classList.add("show");
}

/* ---------------- result ---------------- */
function finishRun(){
  if(S.mode!=="play") return;
  S.mode="result";
  var res=computeLife();
  S.final=res;
  elMainBtn.classList.add("off");
  showResult(res);
}
function computeLife(){
  var o={}; S.results.forEach(function(r){o[r.key]=r;});
  var salary=0;
  if(o["初任給"]){
    var m=o["初任給"].text.match(/月([\d.]+)万円/);
    salary=m?parseFloat(m[1]):0;
    if(o["初任給"].text.indexOf("株券")>=0) salary=0;
  }
  var bonusMonths=0;
  if(o["ボーナス"]){
    var bm=o["ボーナス"].text.match(/年間([\d.]+)ヶ月/);
    bonusMonths=bm?parseFloat(bm[1]):0;
    if(o["ボーナス"].text.indexOf("なし")>=0) bonusMonths=0;
    if(o["ボーナス"].text.indexOf("現物")>=0) bonusMonths=0;
    if(o["ボーナス"].text.indexOf("似顔絵")>=0) bonusMonths=0;
  }
  var ot=0;
  if(o["残業時間"]){
    var om=o["残業時間"].text.match(/月([\d]+)時間/);
    ot=om?parseInt(om[1],10):0;
  }
  var otPay=ot*1500*12;
  var monthYear=Math.round(salary*10000*(12+bonusMonths));
  var annual=Math.round(monthYear+otPay);
  var denom=Math.round(S.denom);
  var onlyOne=denom>=2000000000;
  return {annual:annual,lifetime:annual*40,monthYear:monthYear,otYear:Math.round(otPay),
          salary:salary,bonus:bonusMonths,ot:ot,denom:denom,onlyOne:onlyOne};
}
function fmtDenom(d){
  if(d>=1e8) return "約"+(d/1e8).toFixed(d>=1e9?0:1)+"億分の1";
  if(d>=1e4) return "約"+(d/1e4).toFixed(0)+"万分の1";
  return "約"+Math.round(d)+"分の1";
}
function fmtMoney(y){
  if(y<=0) return "0円（夢）";
  if(y>=1e8) return (y/1e8).toFixed(2)+"億円";
  if(y>=1e4) return Math.round(y/1e4).toLocaleString("ja-JP")+"万円";
  return y.toLocaleString("ja-JP")+"円";
}
/* 万円単位を丸めずに表示（計算式と表示額を完全に一致させる） */
function fmtMan(y){
  if(y<=0) return "0円";
  var man=Math.round(y/10000);
  if(man>=10000){
    var oku=Math.floor(man/10000), rest=man%10000;
    return oku+"億"+(rest?rest.toLocaleString("ja-JP")+"万":"")+"円";
  }
  if(man>=1) return man.toLocaleString("ja-JP")+"万円";
  return y.toLocaleString("ja-JP")+"円";
}
function titleFor(res){
  var ot=res.ot, bonus=res.bonus, salary=res.salary;
  if(res.onlyOne) return "伝説の社畜・人類卒業";
  if(ot>=150) return "社畜の最終形態";
  if(ot>=100) return "社畜の上位種";
  if(ot>=80) return "令和の丸投げ受付嬢";
  if(bonus>=10) return "賞与だけで生きる男";
  if(salary>=35) return "高給取りの社畜";
  if(salary<=12) return "夢を給与代わりにした男";
  if(ot<=10) return "社畜になりきれない男";
  return "ふつうの社畜";
}
function showResult(res){
  var d=S.denom;
  $("#rsRare").textContent=res.onlyOne?"約20億分の1":fmtDenom(d>1e9?1e9:d);
  $("#rsRareSub").textContent=res.onlyOne?"社畜レア度・測定不能":"社畜レア度";
  $("#rsTitle").textContent="「"+titleFor(res)+"」";
  $("#rsLife").textContent="生涯年収："+(res.lifetime>0?fmtMan(res.lifetime):"0円（夢）")+"（40年勤務換算）";
  $("#rsLifeBasis").innerHTML=
    "月収<b>"+res.salary+"万円</b> × （12＋ボーナス<b>"+res.bonus+"ヶ月</b>） ＝ 年<b>"+fmtMan(res.monthYear)+"</b><br>"
    +(res.ot>0 ? "残業代 月<b>"+res.ot+"時間</b> × 1,500円 × 12ヶ月 ＝ 年<b>"+fmtMan(res.otYear)+"</b><br>" : "")
    +"合計 年<b>"+fmtMan(res.annual)+"</b> × 40年 ＝ <b>"+fmtMan(res.lifetime)+"</b>";
  var card=$("#rsCard");
  card.innerHTML="";
  S.results.forEach(function(r){
    var row=document.createElement("div");
    row.className="rs-row";
    row.innerHTML='<span class="k">'+r.key+'</span><span class="v">'+r.text+'</span>';
    card.appendChild(row);
  });
  $("#machine").style.visibility="hidden";
  scrResult.classList.remove("hide");
  scrResult.style.pointerEvents="none";
  setTimeout(function(){ scrResult.style.pointerEvents=""; },700);
  sfxWin();
  rain(70);
  spark(W/2,H*0.22,60,"#ffd84a",1.2);
  elFlash.classList.remove("on"); void elFlash.offsetWidth; elFlash.classList.add("on");
  try{
    var best=parseInt(localStorage.getItem(LS_BEST)||"0",10)||0;
    if(d>best){ best=d; localStorage.setItem(LS_BEST,String(best)); }
  }catch(e){}
}

/* ---------------- input ---------------- */
var holdTimer=null, holdInterval=null;
function pressStart(e){
  e.preventDefault(); e.stopPropagation();
  audioResume();
  if(S.mode==="title") return;
  if(S.mode==="result") return;
  if(S.slot>=SLOTS.length&&!S.spinning){ finishRun(); return; }
  spin();
  clearTimeout(holdTimer); clearInterval(holdInterval);
  holdTimer=setTimeout(function(){
    holdInterval=setInterval(function(){
      if(S.mode!=="play"){ clearInterval(holdInterval); return; }
      if(!S.spinning) spin();
    },240);
  },520);
}
function pressEnd(){
  clearTimeout(holdTimer); clearInterval(holdInterval); holdTimer=null; holdInterval=null;
}
elMainBtn.addEventListener("pointerdown",pressStart);
elMainBtn.addEventListener("touchstart",function(e){ e.stopPropagation(); },{passive:true});
elMainBtn.addEventListener("pointerup",pressEnd);
elMainBtn.addEventListener("pointercancel",pressEnd);
elMainBtn.addEventListener("pointerleave",pressEnd);
elMainBtn.addEventListener("click",function(e){ e.stopPropagation(); });

/* mute */
var elMute=$("#mute");
elMute.addEventListener("pointerdown",function(e){e.stopPropagation()});
elMute.addEventListener("click",function(e){
  e.stopPropagation(); AU.muted=!AU.muted;
  try{localStorage.setItem(LS_MUTE,AU.muted?"1":"0")}catch(err){}
  if(AU.master) AU.master.gain.value=AU.muted?0:0.5;
  elMute.textContent=AU.muted?"🔇":"🔊";
});
elMute.textContent=AU.muted?"🔇":"🔊";

function onTap(el,fn){
  var last=0;
  el.addEventListener("pointerdown",function(e){e.stopPropagation()});
  el.addEventListener("touchstart",function(e){e.stopPropagation()},{passive:true});
  el.addEventListener("click",function(e){
    e.stopPropagation();
    var t=performance.now(); if(t-last<320) return; last=t; fn();
  });
}
onTap($("#startBtn"),startRun);
onTap($("#retryBtn"),startRun);
onTap($("#shareBtn"),function(){
  audioResume();
  var res=S.final; if(!res) return;
  var txt="令和の社畜ガチャを回したら、社畜レア度「"+(res.onlyOne?"約20億分の1・測定不能":fmtDenom(Math.min(S.denom,1e9)))+"」でした。\n"
    +"称号：「"+titleFor(res)+"」\n"
    +"残業 月"+res.ot+"時間／賞与 年"+res.bonus+"ヶ月／生涯年収 "+fmtMan(res.lifetime)+"\n"
    +"お前の社畜レア度は？";
  var url=gameUrl();
  var u="https://twitter.com/intent/tweet?text="+encodeURIComponent(txt)
      +(url?"&url="+encodeURIComponent(url):"")
      +"&hashtags="+encodeURIComponent("社畜ガチャ,令和の社畜,バカゲー");
  window.open(u,"_blank");
});
function gameUrl(){
  if(/^https?:/.test(location.protocol)) return location.href.split("#")[0];
  return "https://xiudengyouhe22-eng.github.io/shachiku-gacha/";
}

/* ---------------- loop ---------------- */
var lastT=0;
function loop(ts){
  if(!lastT) lastT=ts;
  var dt=Math.min(0.05,(ts-lastT)/1000); lastT=ts;
  drawFx(dt);
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);

window.__dbg=function(){
  return {mode:S.mode,slot:S.slot,spinning:S.spinning,results:S.results.length,
    last:S.results.length?S.results[S.results.length-1].text:null,
    denom:S.denom,btn:elMainBtn.textContent,
    resultVisible:!document.querySelector("#scrResult").classList.contains("hide"),
    rare:S.results.filter(function(r){return r.tier>=4}).length};
};
window.__callout=function(a,b){ showCallout(a,b); };
})();
</script>
