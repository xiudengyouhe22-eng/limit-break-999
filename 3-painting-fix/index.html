<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
var LS_BEST="painting_price_best_v1", LS_MUTE="painting_mute_v1";

/* ---------------- audio ---------------- */
var AU={ctx:null,master:null,muted:false};
try{ AU.muted=localStorage.getItem(LS_MUTE)==="1"; }catch(e){}
function audioInit(){
  if(AU.ctx) return;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ AU.ctx=new AC(); AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:0.5; AU.master.connect(AU.ctx.destination);}catch(e){AU.ctx=null;}
}
function audioResume(){ audioInit(); if(AU.ctx&&AU.ctx.state==="suspended"){try{AU.ctx.resume()}catch(e){}} }
function nowT(){return AU.ctx?AU.ctx.currentTime:0}
function tone(o){
  if(!AU.ctx||AU.muted) return;
  var t0=nowT()+(o.delay||0),osc=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  osc.type=o.type||"sine"; osc.frequency.setValueAtTime(Math.max(20,o.f||440),t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+(o.dur||0.2));
  var v=o.v==null?0.16:o.v;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(o.dur||0.2));
  osc.connect(g); g.connect(AU.master); osc.start(t0); osc.stop(t0+(o.dur||0.2)+0.05);
}
function noiseBurst(o){
  if(!AU.ctx||AU.muted) return;
  var dur=o.dur||0.2,t0=nowT()+(o.delay||0);
  var len=Math.floor(AU.ctx.sampleRate*dur),buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,o.pow||2);
  var src=AU.ctx.createBufferSource(); src.buffer=buf;
  var f=AU.ctx.createBiquadFilter(); f.type=o.type||"lowpass"; f.frequency.setValueAtTime(o.f||1200,t0);
  if(o.fTo) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.fTo),t0+dur);
  var g=AU.ctx.createGain(); g.gain.setValueAtTime(o.v==null?0.2:o.v,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(AU.master); src.start(t0); src.stop(t0+dur+0.02);
}
function sfxBrush(){
  noiseBurst({dur:0.055,f:2600+rnd(-400,400),fTo:1200,type:"bandpass",v:0.035});
}
function sfxTick(){ tone({type:"square",f:1200,dur:0.03,v:0.05}); }
function sfxHammer(){ noiseBurst({dur:0.28,f:1800,fTo:180,type:"lowpass",v:0.35});
  tone({type:"sine",f:180,to:60,dur:0.25,v:0.22});
  tone({type:"triangle",f:900,to:300,dur:0.12,v:0.08,delay:0.02}); }
function sfxGavel(){ noiseBurst({dur:0.12,f:2500,fTo:400,type:"lowpass",v:0.3});
  tone({type:"square",f:220,to:90,dur:0.08,v:0.12}); }
function sfxDing(level){
  var base=level>0.7?880:(level>0.4?660:520);
  tone({type:"triangle",f:base,dur:0.25,v:0.14});
  tone({type:"triangle",f:base*1.5,dur:0.25,v:0.10,delay:0.09});
  if(level>0.7){ tone({type:"triangle",f:base*2,dur:0.3,v:0.09,delay:0.18}); }
}

/* ---------------- canvas ---------------- */
var cv=$("#cv"),ctx=cv.getContext("2d");
var W=360,H=640,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth||window.innerWidth; H=cv.clientHeight||window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutPainting();
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,120)});

/* painting internal resolution */
var PW=600, PH=768;
var LAY={x:0,y:0,w:300,h:384,scale:0.5};

/* ---------------- paintings ---------------- */
var SUBJECTS=[
  {id:"mona", name:"謎の微笑み", artist:"レオナルド風", year:"1503年頃"},
  {id:"scream", name:"叫び", artist:"ムンク風", year:"1893年"},
  {id:"pearl", name:"真珠の耳飾り", artist:"フェルメール風", year:"1665年"},
  {id:"sunflower", name:"ひまわり", artist:"ゴッホ風", year:"1888年"}
];

function paintMona(g){
  // background
  var bg=g.createLinearGradient(0,0,0,PH);
  bg.addColorStop(0,"#5b5a3a"); bg.addColorStop(0.45,"#3d4a32"); bg.addColorStop(0.75,"#2a2f24"); bg.addColorStop(1,"#1a1a14");
  g.fillStyle=bg; g.fillRect(0,0,PW,PH);
  // distant landscape
  g.fillStyle="rgba(120,130,95,.55)";
  g.beginPath(); g.moveTo(0,300); g.bezierCurveTo(120,240,180,300,260,270);
  g.bezierCurveTo(360,230,440,290,600,255); g.lineTo(600,420); g.lineTo(0,420); g.closePath(); g.fill();
  g.fillStyle="rgba(90,105,80,.6)";
  g.beginPath(); g.moveTo(0,360); g.bezierCurveTo(160,330,300,370,600,335);
  g.lineTo(600,470); g.lineTo(0,470); g.closePath(); g.fill();
  // river
  g.fillStyle="rgba(150,165,140,.45)";
  g.beginPath(); g.moveTo(120,430); g.bezierCurveTo(220,420,300,460,420,440);
  g.lineTo(430,470); g.bezierCurveTo(300,490,200,455,110,470); g.closePath(); g.fill();
  // body
  g.fillStyle="#2b2318";
  g.beginPath();
  g.moveTo(300,430); g.bezierCurveTo(180,450,120,560,105,PH);
  g.lineTo(495,PH); g.bezierCurveTo(480,560,420,450,300,430); g.closePath(); g.fill();

/* ---------------- state ---------------- */
var S={
  mode:"title",   // title | play | result
  subject:null,
  paint:null, paintCtx:null,
  holesPath:null, holes:[],
  userCanvas:null, userCtx:null,
  time:30, lastTick:30,
  strokes:0, painting:false, lastPt:null,
  color:"#e8b84a", size:20,
  dirty:true,
  score:null, price:0,
  undoStack:[]
};
var PALETTE=["#f2cfa8","#c8452b","#2f7fd0","#3f8f4a","#f2c02a","#7b3fa0","#f5f0e2","#241c16"];
var SIZE_NAMES={10:"細",20:"中",34:"太"};

function layoutPainting(){
  var maxW=Math.min(W*0.76,330);
  var maxH=H*0.52;
  var scale=Math.min(maxW/PW, maxH/PH);
  LAY.w=PW*scale; LAY.h=PH*scale;
  LAY.x=(W-LAY.w)/2; LAY.y=H*0.235;
  if(LAY.y+LAY.h>H*0.76){ LAY.y=Math.max(H*0.16, H*0.76-LAY.h); }
}

/* ---------------- build painting ---------------- */
function buildPainting(subj){
  S.subject=subj;
  var pc=document.createElement("canvas"); pc.width=PW; pc.height=PH;
  var g=pc.getContext("2d");
  PAINTERS[subj.id](g);
  // cracks / aged layer
  g.globalAlpha=0.10;
  g.fillStyle="#3a2a10";
  for(var i=0;i<120;i++){ g.fillRect(rnd(0,PW),rnd(0,PH),rnd(1,3),rnd(1,3)); }
  g.globalAlpha=1;

  // damage: torn holes
  var holes=[];
  var n=ri(7,9);
  var tries=0;
  while(holes.length<n && tries<400){
    tries++;
    var cx=rnd(PW*0.14,PW*0.86), cy=rnd(PH*0.12,PH*0.84);
    var baseR=rnd(26,50);
    var ok=true;
    for(var hh=0;hh<holes.length;hh++){
      var dh=Math.hypot(cx-holes[hh].cx,cy-holes[hh].cy);
      if(dh<holes[hh].r+baseR+14){ ok=false; break; }
    }
    if(!ok) continue;
    var pts=[], seg=14;
    for(var k=0;k<seg;k++){
      var a=k/seg*6.2832;
      var rr=baseR*(0.68+Math.random()*0.62);
      pts.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]);
    }
    holes.push({cx:cx,cy:cy,pts:pts,r:baseR});
  }
  S.holes=holes;
  var path=new Path2D();
  for(var m=0;m<holes.length;m++){
    var hp=holes[m].pts;
    path.moveTo(hp[0][0],hp[0][1]);
    for(var q=1;q<hp.length;q++){
      var p0=hp[q-1],p1=hp[q];
      path.quadraticCurveTo(p0[0],p0[1],(p0[0]+p1[0])/2,(p0[1]+p1[1])/2);
    }
    path.closePath();
  }
  S.holesPath=path;

  // paint the holes as torn backing
  g.save();
  g.clip(path);
  var bg2=g.createLinearGradient(0,0,0,PH);
  bg2.addColorStop(0,"#efe4cd"); bg2.addColorStop(0.5,"#e2d3b6"); bg2.addColorStop(1,"#cdbb98");
  g.fillStyle=bg2; g.fillRect(0,0,PW,PH);
  // canvas weave
  g.strokeStyle="rgba(160,140,105,.22)"; g.lineWidth=1;
  for(var wx=0;wx<PW;wx+=5){ g.beginPath(); g.moveTo(wx,0); g.lineTo(wx,PH); g.stroke(); }
  for(var wy=0;wy<PH;wy+=5){ g.beginPath(); g.moveTo(0,wy); g.lineTo(PW,wy); g.stroke(); }
  // grime inside holes
  g.fillStyle="rgba(120,90,50,.13)";
  for(var d=0;d<40;d++){ g.beginPath(); g.arc(rnd(0,PW),rnd(0,PH),rnd(6,26),0,6.2832); g.fill(); }
  g.restore();

  // torn edges
  g.strokeStyle="rgba(70,45,20,.55)"; g.lineWidth=5; g.stroke(path);
  g.strokeStyle="rgba(255,250,235,.5)"; g.lineWidth=2; g.stroke(path);

  S.paint=pc; S.paintCtx=g;
  // user layer (for analysis)
  var uc=document.createElement("canvas"); uc.width=PW; uc.height=PH;
  S.userCanvas=uc; S.userCtx=uc.getContext("2d");
  S.undoStack=[];
  S.dirty=true;
}

/* ---------------- drawing ---------------- */
function strokeTo(x,y,fromX,fromY){
  var g=S.paintCtx;
  g.save();
  g.clip(S.holesPath);
  g.strokeStyle=S.color;
  g.lineWidth=S.size;
  g.lineCap="round"; g.lineJoin="round";
  g.beginPath(); g.moveTo(fromX,fromY); g.lineTo(x,y); g.stroke();
  // soft edge
  g.globalAlpha=0.35;
  g.lineWidth=S.size*1.35;
  g.beginPath(); g.moveTo(fromX,fromY); g.lineTo(x,y); g.stroke();
  g.restore();

  var ug=S.userCtx;
  ug.save();
  ug.clip(S.holesPath);
  ug.strokeStyle=S.color; ug.lineWidth=S.size; ug.lineCap="round"; ug.lineJoin="round";
  ug.beginPath(); ug.moveTo(fromX,fromY); ug.lineTo(x,y); ug.stroke();
  ug.restore();
}

function screenToPaint(sx,sy){
  return {x:(sx-LAY.x)/LAY.w*PW, y:(sy-LAY.y)/LAY.h*PH};
}
function inPainting(sx,sy){
  return sx>=LAY.x-14&&sx<=LAY.x+LAY.w+14&&sy>=LAY.y-14&&sy<=LAY.y+LAY.h+14;
}

/* ---------------- input ---------------- */
var touchSeen=false;
cv.addEventListener("touchstart",function(e){
  touchSeen=true; audioResume();
  if(S.mode!=="play"){ return; }
  var t=e.changedTouches[0];
  if(!inPainting(t.clientX,t.clientY)) return;
  e.preventDefault();
  var p=screenToPaint(t.clientX,t.clientY);
  S.painting=true; S.lastPt=p;
  S.strokes++;
  // dot
  strokeTo(p.x,p.y,p.x+0.1,p.y+0.1);
  sfxBrush();
},{passive:false});
cv.addEventListener("touchmove",function(e){
  if(S.mode!=="play"||!S.painting) return;
  e.preventDefault();
  var t=e.changedTouches[0];
  var p=screenToPaint(t.clientX,t.clientY);
  if(S.lastPt) strokeTo(p.x,p.y,S.lastPt.x,S.lastPt.y);
  S.lastPt=p;
  if(Math.random()<0.18) sfxBrush();
},{passive:false});
cv.addEventListener("touchend",function(e){
  if(S.mode!=="play") return;
  S.painting=false; S.lastPt=null;
},{passive:false});
cv.addEventListener("touchcancel",function(){ S.painting=false; S.lastPt=null; },{passive:false});

cv.addEventListener("pointerdown",function(e){
  if(e.pointerType==="touch"&&touchSeen) return;
  audioResume();
  if(S.mode!=="play") return;
  if(!inPainting(e.clientX,e.clientY)) return;
  var p=screenToPaint(e.clientX,e.clientY);
  S.painting=true; S.lastPt=p; S.strokes++;
  strokeTo(p.x,p.y,p.x+0.1,p.y+0.1); sfxBrush();
});
cv.addEventListener("pointermove",function(e){
  if(e.pointerType==="touch"&&touchSeen) return;
  if(S.mode!=="play"||!S.painting) return;
  var p=screenToPaint(e.clientX,e.clientY);
  if(S.lastPt) strokeTo(p.x,p.y,S.lastPt.x,S.lastPt.y);
  S.lastPt=p;
});
cv.addEventListener("pointerup",function(){ S.painting=false; S.lastPt=null; });
cv.addEventListener("pointercancel",function(){ S.painting=false; S.lastPt=null; });

/* ---------------- render ---------------- */
function render(){
  // wall background
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#231a11"); bg.addColorStop(0.5,"#1a130c"); bg.addColorStop(1,"#0c0906");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // spotlight
  var sp=ctx.createRadialGradient(W/2,LAY.y+LAY.h*0.3,20,W/2,LAY.y+LAY.h*0.3,Math.max(W,LAY.h)*0.8);
  sp.addColorStop(0,"rgba(255,215,150,.16)"); sp.addColorStop(1,"rgba(255,180,90,0)");
  ctx.fillStyle=sp; ctx.fillRect(0,0,W,H);
  // floor
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(0,H*0.79,W,H*0.21);

  if(!S.paint) return;

  // frame shadow
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.7)"; ctx.shadowBlur=30; ctx.shadowOffsetY=14;
  ctx.fillStyle="#000";
  ctx.fillRect(LAY.x-14,LAY.y-14,LAY.w+28,LAY.h+28);
  ctx.restore();

  // gold frame
  var fg=ctx.createLinearGradient(LAY.x,LAY.y,LAY.x,LAY.y+LAY.h);
  fg.addColorStop(0,"#e6c07a"); fg.addColorStop(0.35,"#b98c3e"); fg.addColorStop(0.6,"#e8cd8d"); fg.addColorStop(1,"#8a6326");
  ctx.fillStyle=fg;
  ctx.fillRect(LAY.x-12,LAY.y-12,LAY.w+24,LAY.h+24);
  ctx.strokeStyle="rgba(255,240,200,.5)"; ctx.lineWidth=1.5;
  ctx.strokeRect(LAY.x-8,LAY.y-8,LAY.w+16,LAY.h+16);
  ctx.strokeStyle="rgba(90,60,20,.6)";
  ctx.strokeRect(LAY.x-12,LAY.y-12,LAY.w+24,LAY.h+24);

  // painting
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(S.paint,LAY.x,LAY.y,LAY.w,LAY.h);

  // glass sheen
  var sh=ctx.createLinearGradient(LAY.x,LAY.y,LAY.x+LAY.w,LAY.y+LAY.h*0.6);
  sh.addColorStop(0,"rgba(255,255,255,.10)"); sh.addColorStop(0.4,"rgba(255,255,255,.02)"); sh.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=sh; ctx.fillRect(LAY.x,LAY.y,LAY.w,LAY.h);

  // hint on remaining holes when just started
  if(S.mode==="play"&&S.time>26){
    ctx.save();
    ctx.globalAlpha=clamp((S.time-26)/3,0,1)*0.9;
    ctx.fillStyle="#2b1a06";
    ctx.font='900 13px "Hiragino Sans",sans-serif';
    ctx.textAlign="center";
    ctx.fillText("穴の中を指で塗って修復",W/2,LAY.y+LAY.h+34);
    ctx.restore();
  }

  // brush cursor ring
  if(S.mode==="play"){
    ctx.save();
    ctx.globalAlpha=0.0; ctx.restore();
  }
}

/* ---------------- appraisal ---------------- */
function analyze(){
  var ug=S.userCtx;
  var img=ug.getImageData(0,0,PW,PH).data;
  var painted=0;
  // hole area
  var hc=document.createElement("canvas"); hc.width=PW; hc.height=PH;
  var hg=hc.getContext("2d");
  hg.fillStyle="#fff"; hg.fill(S.holesPath);
  var hm=hg.getImageData(0,0,PW,PH).data;
  var holeArea=0;
  for(var i=3;i<hm.length;i+=4){ if(hm[i]>128) holeArea++; }
  var hueBins={};
  for(var i2=0;i2<img.length;i2+=4){
    if(img[i2+3]>40){
      painted++;
      var r=img[i2]/255,g=img[i2+1]/255,b=img[i2+2]/255;
      var mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      if(mx-mn<0.06){ hueBins["g"+(mx>0.5?1:0)]=1; }
      else{
        var h;
        if(mx===r) h=((g-b)/(mx-mn))%6; else if(mx===g) h=(b-r)/(mx-mn)+2; else h=(r-g)/(mx-mn)+4;
        h=h*60; if(h<0)h+=360;
        hueBins["h"+Math.floor(h/30)]=1;
      }
    }
  }
  var coverage=holeArea>0?clamp(painted/holeArea,0,1):0;
  var variety=Object.keys(hueBins).length/12;
  return {coverage:coverage,variety:variety,strokes:S.strokes,holeArea:holeArea};
}

function appraise(){
  var a=analyze();
  var coverScore=clamp(a.coverage/0.85,0,1);
  var varScore=clamp(a.variety/0.5,0,1);
  var strokeScore=clamp(a.strokes/22,0,1);
  var total=0.52*coverScore+0.30*varScore+0.18*strokeScore;
  // slight random appraisal wobble (art is subjective)
  total=clamp(total+rnd(-0.05,0.05),0,1);
  var price=Math.round(100*Math.pow(10,total*7));
  price=Math.min(price,1000000000);
  // nice rounding
  if(price>100000000) price=1000000000;
  else if(price>10000000) price=Math.round(price/1000000)*1000000;
  else if(price>1000000) price=Math.round(price/100000)*100000;
  else if(price>100000) price=Math.round(price/10000)*10000;
  else if(price>10000) price=Math.round(price/1000)*1000;
  else if(price>1000) price=Math.round(price/100)*100;

  var grade = price>=100000000?"SSS":price>=10000000?"S":price>=3000000?"A":price>=500000?"B":price>=50000?"C":price>=5000?"D":"E";
  var comment=pickComment(a,price,grade);
  return {a:a,price:price,grade:grade,comment:comment,total:total};
}

  ]
};
function pickOne(arr){ return arr[ri(0,arr.length-1)]; }
function pickComment(a,price,grade){
  if(a.coverage<0.22) return pickOne(COMMENTS.lowCover);
  if(a.variety<0.12) return pickOne(COMMENTS.lowVar);
  if(price>=30000000) return pickOne(COMMENTS.max);
  if(price>=500000) return pickOne(COMMENTS.high);
  return pickOne(COMMENTS.mid);
}

/* ---------------- flow ---------------- */
var elTimer=$("#timer"), elTimeFill=$("#timeFill"), elHud=$("#hud"), elTimebar=$("#timebar");
var elTools=$("#tools"), elSubmit=$("#submitBtn");
var scrTitle=$("#scrTitle"), scrResult=$("#scrResult");

function startGame(){
  audioResume();
  var subj=SUBJECTS[ri(0,SUBJECTS.length-1)];
  buildPainting(subj);
  S.mode="play"; S.time=30; S.lastTick=30; S.strokes=0; S.painting=false; S.lastPt=null; S.score=null;
  elHud.classList.remove("off"); elTimebar.classList.remove("off");
  elTools.classList.remove("off"); elSubmit.classList.remove("off");
  $("#subjName").textContent="『"+subj.name+"』";
  $("#subjMeta").textContent=subj.artist+"／"+subj.year;
  scrTitle.classList.add("hide"); scrResult.classList.add("hide");
  elTimer.textContent="30"; elTimer.classList.remove("hot");
  elTimeFill.style.width="100%";
  elTimebar.style.opacity="1";
  tone({type:"triangle",f:520,to:780,dur:0.2,v:0.12});
  setTimeout(function(){ if(S.mode==="play") tone({type:"triangle",f:780,dur:0.2,v:0.10}); },140);
}

function submit(){
  if(S.mode!=="play") return;
  S.mode="appraise";
  S.painting=false; S.lastPt=null;
  elTools.classList.add("off"); elSubmit.classList.add("off");
  elHud.classList.add("off"); elTimebar.classList.add("off");
  sfxHammer();
  var res=appraise();
  S.score=res; S.price=res.price;
  setTimeout(function(){ showResult(res); },520);
}

function showResult(res){
  S.mode="result";
  var priceTxt=formatPrice(res.price);
  $("#rsPrice").innerHTML=priceTxt+"<small></small>";
  $("#rsGrade").textContent="鑑定グレード "+res.grade;
  $("#rsComment").innerHTML="<b>鑑定士：</b>"+res.comment;
  var a=res.a;
  $("#rsMeta").textContent="修復率 "+Math.round(a.coverage*100)+"% ／ 使用色 "+Math.round(a.variety*12)+"系統 ／ 線 "+a.strokes+"本";
  buildCard(res);
  var best=0;
  try{ best=parseInt(localStorage.getItem(LS_BEST)||"0",10)||0; }catch(e){}
  if(res.price>best){ best=res.price; try{localStorage.setItem(LS_BEST,String(best))}catch(e){} }
  scrResult.classList.remove("hide");
  sfxDing(res.total);
  setTimeout(sfxGavel,420);
}
function formatPrice(p){
  if(p>=100000000) return (p/100000000).toFixed(0)+"億円";
  if(p>=10000) return (p/10000).toFixed(p>=1000000?0:1)+"万円";
  return p.toLocaleString("ja-JP")+"円";
}

function buildCard(res){
  var cw=640, ch=820;
  var c=document.createElement("canvas"); c.width=cw; c.height=ch;
  var g=c.getContext("2d");
  var bg=g.createLinearGradient(0,0,0,ch);
  bg.addColorStop(0,"#1d150c"); bg.addColorStop(1,"#070504");
  g.fillStyle=bg; g.fillRect(0,0,cw,ch);
  // glow
  var gl=g.createRadialGradient(cw/2,300,60,cw/2,300,420);
  gl.addColorStop(0,"rgba(230,180,80,.22)"); gl.addColorStop(1,"rgba(230,180,80,0)");
  g.fillStyle=gl; g.fillRect(0,0,cw,ch);
  // title
  g.fillStyle="#e8b96a"; g.font='800 20px "Hiragino Sans",sans-serif'; g.textAlign="center";
  g.fillText("ヤバい絵画の修復師",cw/2,46);
  // painting
  var pw=340, ph=pw*PH/PW, px=(cw-pw)/2, py=68;
  g.fillStyle="#0b0805"; g.fillRect(px-16,py-16,pw+32,ph+32);
  var fg=g.createLinearGradient(px,py,px,py+ph);
  fg.addColorStop(0,"#e6c07a"); fg.addColorStop(0.5,"#b98c3e"); fg.addColorStop(1,"#8a6326");
  g.fillStyle=fg; g.fillRect(px-11,py-11,pw+22,ph+22);
  g.drawImage(S.paint,px,py,pw,ph);
  // subject
  g.fillStyle="#c9b18b"; g.font='700 17px "Hiragino Sans",sans-serif';
  g.fillText("『"+S.subject.name+"』 "+S.subject.artist,cw/2,py+ph+38);
  // price
  g.fillStyle="#fff"; g.font='900 70px "Hiragino Sans",sans-serif';
  g.shadowColor="rgba(255,200,90,.6)"; g.shadowBlur=26;
  g.fillText(formatPrice(res.price),cw/2,py+ph+114);
  g.shadowBlur=0;
  // grade + comment
  g.fillStyle="#ffd89a"; g.font='900 23px "Hiragino Sans",sans-serif';
  g.fillText("鑑定グレード "+res.grade,cw/2,py+ph+152);
  g.fillStyle="#e0cba9"; g.font='700 16px "Hiragino Sans",sans-serif';
  wrapText(g,res.comment,cw/2,py+ph+190,cw-100,25);
  // footer
  g.fillStyle="#8f7a58"; g.font='700 14px "Hiragino Sans",sans-serif';
  g.fillText("修復率 "+Math.round(res.a.coverage*100)+"% ／ 使用色 "+Math.round(res.a.variety*12)+"系統 ／ 線 "+res.a.strokes+"本",cw/2,ch-30);

  $("#cardImg").src=c.toDataURL("image/png");
}
function wrapText(g,text,x,y,maxW,lh){
  var chars=Array.from(text), line="", lines=[];
  for(var i=0;i<chars.length;i++){
    var test=line+chars[i];
    if(g.measureText(test).width>maxW&&line){ lines.push(line); line=chars[i]; }
    else line=test;
  }
  lines.push(line);
  for(var j=0;j<Math.min(3,lines.length);j++){
    g.fillText(lines[j]+(j===2&&lines.length>3?"…":""),x,y+j*lh);
  }
}

/* tools UI */
function buildPalette(){
  var p=$("#palette");
  PALETTE.forEach(function(col,i){
    var b=document.createElement("button");
    b.className="pen"+(i===4?" sel":"");
    b.style.background=col;
    b.setAttribute("data-c",col);
    b.addEventListener("pointerdown",function(e){e.stopPropagation()});

      S.color=col;
      Array.prototype.forEach.call(document.querySelectorAll(".pen"),function(el){el.classList.toggle("sel",el.getAttribute("data-c")===col)});
      tone({type:"triangle",f:700+i*40,dur:0.05,v:0.06});
    });
    p.appendChild(b);
  });
  if(PALETTE[4]) S.color=PALETTE[4];
}

function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("on");

function onTap(el,fn){
  var last=0;
  el.addEventListener("pointerdown",function(e){e.stopPropagation()});
  el.addEventListener("touchstart",function(e){e.stopPropagation()},{passive:true});
  el.addEventListener("click",function(e){
    e.stopPropagation();
    var t=performance.now(); if(t-last<320) return; last=t; fn();
  });
}

/* ---------------- loop ---------------- */
var lastT=0;
function loop(ts){
  if(!lastT) lastT=ts;
  var dt=Math.min(0.05,(ts-lastT)/1000); lastT=ts;
  if(S.mode==="play"){
    S.time-=dt;
    if(S.time<0) S.time=0;
    var shown=Math.ceil(S.time);
    if(shown!==S.lastTick){ S.lastTick=shown; if(shown<=10&&shown>0) sfxTick(); }
    elTimer.textContent=shown;
    elTimer.classList.toggle("hot",shown<=10);
    elTimeFill.style.width=(S.time/30*100).toFixed(1)+"%";
    if(S.time<=0) submit();
  }
  render();
  requestAnimationFrame(loop);
}

/* init */
resize();
requestAnimationFrame(loop);
window.__dbg=function(){

    subject:S.subject?S.subject.name:null, price:S.price,
    score:S.score?{c:+S.score.a.coverage.toFixed(3),v:+S.score.a.variety.toFixed(3),g:S.score.grade}:null};
};
})();
