<style>

  /* ---------- HUD ---------- */

  .lbl{font-size:9px;letter-spacing:.24em;color:#5f7ea3;font-weight:700;}
  .hud-val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;

  #dots{display:flex;gap:5px;margin-top:3px;}

  .dot.great{background:#ffe600;box-shadow:0 0 10px #ffe600;}
  .dot.bust{background:#ff2a4d;box-shadow:0 0 10px #ff2a4d;}
  .dot.now{background:#fff;box-shadow:0 0 10px #fff;transform:scale(1.3);}
  #muteBtn{

  }
  #muteBtn:active{transform:scale(.92);}

  .screen{
    position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    padding:calc(64px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .screen.show{opacity:1;pointer-events:auto;}
  #scrGame{touch-action:none;}

  /* ---------- title ---------- */
  #scrTitle{gap:0;justify-content:center;}
  .logo{text-align:center;line-height:.92;margin-bottom:22px;}
  .logo .l1{
    display:block;font-size:clamp(30px,10.5vw,52px);font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(180deg,#ffffff 0%,#9be9ff 45%,#0a9cff 100%);

  .badge.gold{border-color:rgba(255,230,0,.5);color:#ffe600;background:rgba(255,230,0,.08);}
  #resTotal{

  .stat .k{font-size:8.5px;letter-spacing:.16em;color:#5f8bad;font-weight:800;}
  .stat .v{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:3px;color:#d8f3ff;}

  #roundList{width:100%;max-width:420px;margin:6px 0 0;display:flex;flex-direction:column;gap:5px;}
  .rrow{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:10px;

  .rrow .rn{font-size:9.5px;letter-spacing:.14em;color:#5f8bad;font-weight:800;width:34px;}
  .rrow .rp{font-size:14px;font-weight:900;width:74px;text-align:right;}
  .rrow .rt{font-size:8.5px;letter-spacing:.1em;font-weight:800;flex:1;text-align:left;padding-left:4px;}
  .rrow .rs{font-size:13px;font-weight:800;width:92px;text-align:right;}
  .rrow.bust .rp,.rrow.bust .rs{color:#ff5470;}
  .rrow.bust .rt{color:#ff5470;}
  .rrow.god .rp{color:#ff2fd0;}

  #resActions{width:100%;max-width:420px;display:flex;flex-direction:column;gap:9px;margin:18px 0 calc(26px + env(safe-area-inset-bottom));}
  .btn.share{
    height:56px;font-size:16px;color:#05010e;
    background:linear-gradient(135deg,#ffffff,#c9d9ff);
    box-shadow:0 0 26px rgba(255,255,255,.22);
  }
  .btn.retry{
    height:52px;font-size:14px;color:#9fe9ff;background:rgba(0,229,255,.08);
    border:1px solid rgba(0,229,255,.4);letter-spacing:.14em;
  }
  .btn.retry small{font-size:9px;letter-spacing:.1em;opacity:.7;font-weight:700;}

  @media (min-height:760px){
    .tagline{font-size:14.5px;}
  }
</style>

<body>
<div id="stage">

  <div id="impact"></div>
  <div id="banner"></div>
  <div id="flash"></div>

<script>
(function(){
"use strict";

/* =====================================================================
   LIMIT BREAK 99.9% — single file, no external assets
   ===================================================================== */

/* ---------- 公開URL（ホスティングしたらここに入れる） ---------- */
var CONFIG_GAME_URL = ""; // ← どこかに公開したらそのURLを入れる（http/httpsで開いた時は自動でlocation.hrefを使用）

var $ = function(s){ return document.querySelector(s); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var lerp = function(a,b,t){ return a+(b-a)*t; };
function smooth(a,b,x){ var t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
var fmt = function(n){ return Math.round(n).toLocaleString("en-US"); };

/* ---------------- storage ---------------- */
var STORE_KEY = "lb99.v1";
var store = { best:0, bestPrec:0, plays:0, muted:false };
try {
  var raw = localStorage.getItem(STORE_KEY);
  if (raw) { var o = JSON.parse(raw); if (o && typeof o === "object") {
    store.best = +o.best||0; store.bestPrec = +o.bestPrec||0; store.plays = +o.plays||0; store.muted = !!o.muted;
  } }
} catch(e){}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }

/* =====================================================================
   AUDIO (Web Audio API synth only)
   ===================================================================== */
var actx = null, master = null, noiseBuf = null, distCurve = null;
var muted = !!store.muted;

function ensureAudio(){
  if (!actx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.8;
    master.connect(actx.destination);
  }
  if (actx.state === "suspended") { try{ actx.resume(); }catch(e){} }
  return actx;
}
function noise(){ 
  if (!noiseBuf) {
    var len = Math.floor(actx.sampleRate * 1.2);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
  }
  return noiseBuf;
}
function distortion(){
  if (!distCurve) {
    var n = 1024, c = new Float32Array(n);
    for (var i=0;i<n;i++){ var x = i*2/n - 1; c[i] = Math.tanh(x*4.2); }
    distCurve = c;
  }
  var ws = actx.createWaveShaper(); ws.curve = distCurve; ws.oversample = "2x"; return ws;
}
/* tone({type,f0,f1,dur,gain,at,filter,freq,q,attack}) */
function tone(o){
  if (!actx || muted) return;
  var t0 = actx.currentTime + (o.at||0);
  var dur = o.dur || 0.2;
  var osc = actx.createOscillator();
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(Math.max(1,o.f0), t0);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t0+dur);
  var node = osc;
  if (o.filter) {
    var f = actx.createBiquadFilter();
    f.type = o.filter; f.frequency.value = o.freq||1600; f.Q.value = o.q||1;
    osc.connect(f); node = f;
  }
  var g = actx.createGain();
  var peak = (o.gain==null?0.2:o.gain);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+(o.attack||0.012));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  node.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function noiseBurst(dur, freq, gain, ftype, sweepTo, at){
  if (!actx || muted) return;
  var t0 = actx.currentTime + (at||0);
  var src = actx.createBufferSource(); src.buffer = noise(); src.loop = true;
  var f = actx.createBiquadFilter(); f.type = ftype||"lowpass";
  f.frequency.setValueAtTime(freq, t0);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,sweepTo), t0+dur);
  f.Q.value = 0.8;
  var g = actx.createGain();
  g.gain.setValueAtTime(Math.max(0.0002,gain), t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0+dur+0.03);
}

/* --- persistent charge voice --- */
var chargeVoice = null;
function startChargeSound(){
  if (!actx || muted) return;
  stopChargeSound(true);
  var t = actx.currentTime;
  var o1 = actx.createOscillator(); o1.type = "sawtooth";
  var o2 = actx.createOscillator(); o2.type = "square";
  var f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500; f.Q.value = 7;
  var g = actx.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.075, t+0.09);
  o1.frequency.value = 55; o2.frequency.value = 82;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
  o1.start(t); o2.start(t);
  chargeVoice = { o1:o1, o2:o2, f:f, g:g };
}
function updateChargeSound(u){
  if (!chargeVoice || !actx) return;
  var t = actx.currentTime;
  var base = 52 * Math.pow(2, clamp(u,0,1)*4.6);
  chargeVoice.o1.frequency.setTargetAtTime(base, t, 0.04);
  chargeVoice.o2.frequency.setTargetAtTime(base*1.503, t, 0.04);
  chargeVoice.f.frequency.setTargetAtTime(300 + u*7600, t, 0.04);
  chargeVoice.g.gain.setTargetAtTime(0.045 + u*0.11, t, 0.05);
}
function stopChargeSound(instant){
  if (!chargeVoice || !actx) return;
  var v = chargeVoice; chargeVoice = null;
  var t = actx.currentTime;
  try {
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setTargetAtTime(0.0001, t, instant?0.005:0.03);
    v.o1.stop(t+0.2); v.o2.stop(t+0.2);
  } catch(e){}
}

function sfxBust(){

  o.connect(ws); ws.connect(g); g.connect(master);

}

/* =====================================================================
   PARTICLES
   ===================================================================== */
var parts = [], shocks = [], rings = [];
function spawnPart(x,y,vx,vy,life,size,hue,add){
  if (parts.length > 900) return;
  parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,hue:hue,add:add!==false});
}
function burst(x,y,n,hue,power,spread){
  spread = spread==null?Math.PI*2:spread;
  for (var i=0;i<n;i++){
    var a = Math.random()*spread - spread/2 + (spread>=Math.PI*2?0:0);
    var sp = power*(0.25+Math.random()*0.95);
    spawnPart(x,y, Math.cos(a)*sp, Math.sin(a)*sp, 0.45+Math.random()*0.75,
              1.4+Math.random()*3.2, hue + (Math.random()*70-35));
  }
}
function updateParts(dt){
  for (var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - 1.6*dt); p.vy *= (1 - 1.6*dt);
    p.vy += 26*dt;
  }
  for (var j=shocks.length-1;j>=0;j--){
    var s = shocks[j];
    s.life -= dt; s.r += s.sp*dt;
    if (s.life<=0) shocks.splice(j,1);
  }
}
function drawParts(){
  ctx.globalCompositeOperation = "lighter";
  for (var i=0;i<parts.length;i++){
    var p = parts[i], a = clamp(p.life/p.max,0,1);
    ctx.globalAlpha = a;
    ctx.fillStyle = "hsl("+p.hue+",100%,"+(58+18*a)+"%)";
    var s = p.size*(0.35+0.65*a);
    ctx.beginPath(); ctx.arc(p.x,p.y,s,0,6.2832); ctx.fill();
  }
  for (var j=0;j<shocks.length;j++){
    var s2 = shocks[j];
    ctx.globalAlpha = clamp(s2.life/s2.max,0,1)*0.85;
    ctx.strokeStyle = "hsl("+s2.hue+",100%,65%)";
    ctx.lineWidth = s2.w * clamp(s2.life/s2.max,0,1);
    ctx.beginPath(); ctx.arc(s2.x,s2.y,s2.r,0,6.2832); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

   BACKGROUND
   ===================================================================== */
function drawBackground(t, heat){
  var hue1 = lerp(190, 345, heat);
  ctx.fillStyle = "#05010e";
  ctx.fillRect(0,0,W,H);

  // neon halo hugging the gauge (keeps the field dark)
  var g = ctx.createRadialGradient(CX, CY, R*0.92, CX, CY, R*2.1);
  g.addColorStop(0, "hsla("+hue1+",100%,55%,0)");
  g.addColorStop(0.18, "hsla("+hue1+",100%,55%,"+(0.10+heat*0.18)+")");
  g.addColorStop(0.55, "hsla("+hue1+",100%,50%,"+(0.03+heat*0.06)+")");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // moving grid
  ctx.save();
  ctx.globalAlpha = 0.06 + heat*0.12;
  ctx.strokeStyle = "hsl("+hue1+",100%,64%)";
  ctx.lineWidth = 1;
  var spacing = 44, off = (t*22) % spacing;
  ctx.beginPath();
  for (var x=-spacing; x<W+spacing; x+=spacing){
    ctx.moveTo(x+off*0.18, 0); ctx.lineTo(x+off*0.18, H);
  }
  for (var y=-spacing; y<H+spacing; y+=spacing){
    ctx.moveTo(0, y+off); ctx.lineTo(W, y+off);
  }
  ctx.stroke();
  ctx.restore();

  // floor glow
  var gg = ctx.createLinearGradient(0, H*0.6, 0, H);
  gg.addColorStop(0, "rgba(0,0,0,0)");
  gg.addColorStop(1, "hsla("+hue1+",100%,50%,"+(0.03+heat*0.09)+")");
  ctx.fillStyle = gg; ctx.fillRect(0,H*0.6,W,H*0.4);
}

/* =====================================================================
   GAUGE
   ===================================================================== */
var A0 = Math.PI*0.75, A1 = Math.PI*2.25;
function angFor(u){ return A0 + (A1-A0)*clamp(u,0,1); }

function drawGauge(u, charging, t){
  var lw = Math.max(9, R*0.135);
  // outer soft ring
  ctx.save();
  ctx.lineCap = "butt";

  // inner core disc (makes the number pop)
  var disc = ctx.createRadialGradient(CX,CY,R*0.2,CX,CY,R*0.94);
  disc.addColorStop(0, "rgba(3,0,9,0.82)");
  disc.addColorStop(0.75, "rgba(3,0,9,0.62)");
  disc.addColorStop(1, "rgba(3,0,9,0)");
  ctx.fillStyle = disc;
  ctx.beginPath(); ctx.arc(CX,CY,R*0.95,0,6.2832); ctx.fill();

  // track
  ctx.beginPath();
  ctx.arc(CX,CY,R,A0,A1);
  ctx.strokeStyle = "rgba(255,255,255,0.055)";
  ctx.lineWidth = lw;
  ctx.stroke();

  // danger zone 95-100 (thin warning stripe on the outer edge)
  var dp = 0.92 + 0.08*Math.sin(t*7);
  ctx.beginPath();
  ctx.arc(CX,CY,R+lw*0.30,angFor(0.95),A1);
  ctx.strokeStyle = "rgba(255,42,77,"+(0.35+dp*0.45)+")";
  ctx.lineWidth = lw*0.34; ctx.stroke();
  ctx.beginPath();
  ctx.arc(CX,CY,R,angFor(0.95),A1);
  ctx.strokeStyle = "rgba(255,42,77,"+(0.07+dp*0.10)+")";
  ctx.lineWidth = lw; ctx.stroke();

  // ticks
  ctx.lineWidth = 1.6;
  for (var i=0;i<=20;i++){
    var a = angFor(i/20);
    var on = (i/20) <= u;
    ctx.beginPath();
    var r0 = R + lw*0.62, r1 = R + lw*0.62 + (i%4===0?8:4);
    ctx.moveTo(CX+Math.cos(a)*r0, CY+Math.sin(a)*r0);
    ctx.lineTo(CX+Math.cos(a)*r1, CY+Math.sin(a)*r1);
    ctx.strokeStyle = on ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.12)";
    ctx.stroke();
  }

  // progress
  if (u > 0.001){
    var hue = lerp(186, 352, Math.pow(u, 1.7));
    var pulse = u > 0.9 ? (3 + 6*Math.sin(t*26)) : 0;
    ctx.beginPath();
    ctx.arc(CX,CY,R,A0,angFor(u));
    ctx.strokeStyle = "hsl("+hue+",100%,"+(62+u*8)+"%)";
    ctx.lineWidth = lw;
    ctx.shadowColor = "hsl("+hue+",100%,60%)";
    ctx.shadowBlur = 18 + u*46 + pulse;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // bright core filament
    ctx.beginPath();
    ctx.arc(CX,CY,R,A0,angFor(u));
    ctx.strokeStyle = "rgba(255,255,255,"+(0.30+0.5*u)+")";
    ctx.lineWidth = lw*0.30;
    ctx.stroke();

    // leading dot
    var ea = angFor(u);
    var ex = CX+Math.cos(ea)*R, ey = CY+Math.sin(ea)*R;
    ctx.beginPath();
    ctx.arc(ex,ey,lw*0.62,0,6.2832);
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "hsl("+hue+",100%,65%)";
    ctx.shadowBlur = 26+u*40;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // inner aura
  var aura = ctx.createRadialGradient(CX,CY,R*0.15,CX,CY,R*0.98);
  var ah = lerp(190,350,Math.pow(u,1.7));
  aura.addColorStop(0, "hsla("+ah+",100%,60%,"+(0.02+u*0.10)+")");
  aura.addColorStop(1, "hsla("+ah+",100%,60%,0)");
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(CX,CY,R*0.95,0,6.2832); ctx.fill();

  ctx.restore();
}

   ===================================================================== */
function beginHold(){
  if (phase !== "ready" && phase !== "charging") return;
  if (phase === "ready") {
    phase = "charging";
    E = 0; ES = 0; tickIdx = 0; dangerAcc = 0; fakeTimer = 0; fakeCool = 0;
  }
  if (held) return;
  held = true;
  ensureAudio();
  startChargeSound();
  holdHint.textContent = "離すな…！";
  holdHint.className = "hold";
  gaugeBox.style.display = "flex";
}

function endHold(){
  if (!held && phase !== "charging") return;
  held = false;
  if (phase !== "charging") return;
  releaseNow();
}

function releaseNow(){
  stopChargeSound(false);
  var e = Math.round(ES*10)/10;   // 表示と同じ精度で判定する
  if (e >= BUST) { doBust(); return; }

  var tier = tierOf(e);
  var base = Math.floor(e*e*4 + e*20);
  var sc = Math.floor(base * tier.mul);

  roundScores[round] = sc;
  roundPrecs[round] = e;
  roundLabels[round] = tier.label.replace(/!+/g,"");
  totalScore += sc;
  maxPrec = Math.max(maxPrec, e);

  // hud
  hudScore.textContent = fmt(totalScore);
  hudScore.classList.remove("pop"); void hudScore.offsetWidth; hudScore.classList.add("pop");
  markDot(round, tier.mul >= 1.5 ? "great" : "done");

  // fx
  var hue = lerp(186, 350, Math.pow(clamp(e/100,0,1),1.7));
  burst(CX, CY, tier.mul>=3 ? 120 : (tier.mul>=1.5 ? 80 : 45), hue, tier.mul>=3 ? 520 : 300);
  shocks.push({x:CX,y:CY,r:R*0.9,sp: (tier.mul>=3? 520:380), w: R*0.10, life:0.45, max:0.45, hue:hue});
  if (tier.mul >= 3) shocks.push({x:CX,y:CY,r:R*0.5,sp:360,w:R*0.055,life:0.6,max:0.6,hue:300});
  shakeAmt = tier.mul>=3 ? 1.35 : (tier.mul>=1.5 ? 1.0 : 0.6);
  hitstop = tier.mul>=3 ? 0.085 : 0.05;
  flash(tier.mul>=3 ? 0.9 : 0.45);
  sfxRelease(tier);
  showImpact(tier.label, tier.sub + " / +" + fmt(sc), tier.cls);
  if (navigator.vibrate) { try{ navigator.vibrate(tier.mul>=3?[0,30,40,60]:[0,25]); }catch(err){} }

  vignette.style.opacity = 0;
  holdHint.textContent = "";
  phase = "resolve";

  var my = gen;
  setTimeout(function(){ if (my===gen) nextRound(); }, 1080);
}

function doBust(){
  stopChargeSound(true);
  E = BUST; ES = BUST;
  roundScores[round] = 0;
  roundPrecs[round] = 100;
  roundLabels[round] = "BUST";
  busts++;
  hudScore.textContent = fmt(totalScore);
  markDot(round, "bust");
  burst(CX, CY, 150, 0, 620);
  shocks.push({x:CX,y:CY,r:R*0.8,sp:640,w:R*0.12,life:0.55,max:0.55,hue:0});
  shakeAmt = 2.0; hitstop = 0.11;
  flash(1);
  sfxBust();
  showImpact("BUST!!", "0点 / 100.0% 突破", "bust");
  if (navigator.vibrate) { try{ navigator.vibrate([0,70,60,120]); }catch(err){} }
  vignette.style.opacity = 1;
  holdHint.textContent = "";
  phase = "resolve";
  var my = gen;
  setTimeout(function(){ if (my===gen) nextRound(); }, 1180);
}

function nextRound(){
  if (round >= 4) { showResult(); return; }
  startRound(round+1);
}

/* =====================================================================
   RESULT
   ===================================================================== */
function showResult(){
  gen++;
  phase = "result";
  gaugeBox.style.display = "none";
  hide(scrGame); show(scrResult);
  hud.classList.add("off");
  vignette.style.opacity = 0;
  parts.length = 0;

  var isNew = totalScore > store.best;
  store.best = Math.max(store.best, totalScore);
  if (maxPrec > store.bestPrec) store.bestPrec = maxPrec;
  store.plays++;
  saveStore();

  var title = titleFor(totalScore);
  if (busts === 5) title = "自爆の帝王";
  else if (busts >= 3 && totalScore < 90000) title = "自爆の申し子";
  $("#resTitle").textContent = "「" + title + "」";

  // badges
  var badges = [];
  if (busts === 0 && Math.min.apply(null, roundPrecs.length?roundPrecs:[0]) >= 95) badges.push({t:"NO BUST / 全ラウンドCRITICAL", g:true});
  if (maxPrec >= 99.9) badges.push({t:"0.1%の芸術家", g:true});
  if (busts >= 3) badges.push({t:"自爆マニア", g:false});
  if (roundScores.length && roundScores.every(function(s){return s===0;})) badges.push({t:"伝説の5連バースト", g:false});
  var bEl = $("#resBadges");
  bEl.innerHTML = "";
  badges.forEach(function(b){
    var d = document.createElement("div");
    d.className = "badge" + (b.g?" gold":"");
    d.textContent = b.t;
    bEl.appendChild(d);
  });

  // count up total
  var totalEl = $("#resTotal"), start = performance.now(), dur = 900;
  function tick(now){
    if (phase !== "result") return;
    var p = clamp((now-start)/dur,0,1);
    var ease = 1-Math.pow(1-p,3);
    totalEl.textContent = fmt(totalScore*ease);
    if (p < 1) requestAnimationFrame(tick); else totalEl.textContent = fmt(totalScore);
  }
  totalEl.textContent = "0";
  requestAnimationFrame(tick);

  $("#newRecord").className = isNew ? "on" : "";
  $("#stPrec").textContent = maxPrec.toFixed(1) + "%";
  $("#stBust").textContent = busts + "回";
  $("#stBest").textContent = fmt(store.best);

  // round rows
  var list = $("#roundList");
  list.innerHTML = "";
  for (var i=0;i<5;i++){
    var sc2 = roundScores[i];
    var pr = roundPrecs[i];
    var lb = roundLabels[i] || "—";
    var row = document.createElement("div");
    row.className = "rrow" + (lb==="BUST" ? " bust" : (lb.indexOf("GODLIKE")>=0 ? " god" : ""));
    row.innerHTML = '<span class="rn">R'+(i+1)+'</span>'
      + '<span class="rp">'+(lb==="BUST" ? "100.0%" : (pr!=null?pr.toFixed(1)+"%":"—"))+'</span>'
      + '<span class="rt">'+lb+'</span>'
      + '<span class="rs">'+(sc2?("+"+fmt(sc2)):"0")+'</span>';
    list.appendChild(row);
  }

  // share
  $("#shareBtn").onclick = function(){
    ensureAudio(); sfxUIClick();
    var url = gameUrl();
    var text = "LIMIT BREAK 99.9% で " + fmt(totalScore) + "点！\n"
             + "称号「" + title + "」／最高ギリギリ " + maxPrec.toFixed(1) + "%"
             + (busts ? "（自爆" + busts + "回）" : "")
             + "\nお前は99.9%で止められるか？";
    var u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text)
          + (url ? "&url=" + encodeURIComponent(url) : "")
          + "&hashtags=" + encodeURIComponent("LIMITBREAK999");
    window.open(u, "_blank");
  };

  $("#retryBtn").onclick = function(){
    ensureAudio(); sfxUIClick();
    hide(scrResult); show(scrGame);
    startGame();
  };
}

function gameUrl(){
  if (/^https?:/.test(location.protocol)) return location.href.split("#")[0];
  return CONFIG_GAME_URL;
}

/* =====================================================================
   FLASH/SHAKE
   ===================================================================== */
function flash(power){
  flashEl.style.background = "rgba(255,255,255," + power + ")";
  flashEl.classList.remove("on");
  void flashEl.offsetWidth;
  flashEl.classList.add("on");
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function computeES(t){
  var r = ROUNDS[round];
  return clamp(E + r.jit*Math.sin(t*3.4 + round*1.9), 0, 101);
}

function update(dt){
  tGlobal += dt;

  if (hitstop > 0){ hitstop -= dt; return; }

  if (phase === "charging"){
    var r = ROUNDS[round];
    fakeCool = Math.max(0, fakeCool - dt);
    if (r.fake && fakeTimer <= 0 && E > 62 && E < 80 && fakeCool <= 0 && Math.random() < dt*1.4){
      fakeTimer = 0.22; fakeCool = 2.6;
      sfxFake();
      showImpact("!!", "FAKE ACCEL", "crit");
    }
    if (fakeTimer > 0) fakeTimer -= dt;

    var u = clamp(E/100, 0, 1.4);
    var v = r.base * (1 + r.k*u) * (1 - r.d*smooth(0.8,1.0,Math.min(u,1)));
    if (fakeTimer > 0) v *= 1.55;
    E += v*dt;
    ES = computeES(tGlobal);

    // ticks
    while (tickIdx <= 20 && ES >= tickIdx*5 - 0.001 && tickIdx < 20){
      if (tickIdx > 0) sfxTick(tickIdx);
      tickIdx++;
    }
    // danger beeps
    if (ES >= 90){
      dangerAcc -= dt;
      if (dangerAcc <= 0){ sfxDanger(); dangerAcc = 0.15 - (ES-90)*0.0095; }
    }
    updateChargeSound(u);
    if (ES >= BUST){ doBust(); return; }
  } else if (phase === "ready"){
    ES = 0; E = 0;
  }

  // ambient particles during charge
  if (phase === "charging"){
    var huec = lerp(186,350,Math.pow(clamp(ES/100,0,1),1.7));
    var ea = angFor(ES/100);
    var px = CX + Math.cos(ea)*R, py = CY + Math.sin(ea)*R;
    for (var i=0;i<2;i++){
      var a2 = ea + (Math.random()-0.5)*0.5;
      var rr = R*(1.12+Math.random()*0.28);
      spawnPart(CX+Math.cos(a2)*rr, CY+Math.sin(a2)*rr,
                Math.cos(a2+1.4)*40, Math.sin(a2+1.4)*40,
                0.35+Math.random()*0.35, 1.2+Math.random()*2.0, huec);
    }
    if (ES > 92 && Math.random() < 0.5){
      spawnPart(px, py, (Math.random()-0.5)*260, (Math.random()-0.5)*260, 0.3, 1.8, 0);
    }
  }

  updateParts(dt);
  shakeAmt *= Math.pow(0.0015, dt);
  if (shakeAmt < 0.004) shakeAmt = 0;
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  var heat = 0;
  if (phase === "charging" || phase === "resolve") heat = clamp(ES/100,0,1);
  if (phase === "title") heat = 0.08 + 0.04*Math.sin(tGlobal*1.2);

  drawBackground(tGlobal, heat);

  // title ambient orbs
  if (phase === "title" || phase === "result"){
    ctx.globalCompositeOperation = "lighter";
    for (var i=0;i<26;i++){
      var tt = tGlobal*0.35 + i*1.7;
      var ox = (Math.sin(tt*0.9+i)*0.5+0.5)*W;
      var oy = (Math.cos(tt*0.7+i*0.6)*0.5+0.5)*H*0.85;
      var rr2 = 2 + (Math.sin(tt*1.3+i)*0.5+0.5)*4;
      ctx.globalAlpha = 0.10 + 0.14*(Math.sin(tt*2+i)*0.5+0.5);
      ctx.fillStyle = i%3===0 ? "#00e5ff" : (i%3===1 ? "#ff2fd0" : "#ffe600");
      ctx.beginPath(); ctx.arc(ox,oy,rr2,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  if (phase === "charging" || phase === "ready" || phase === "resolve" || phase === "intro"){
    drawGauge(ES/100, phase==="charging", tGlobal);
  }

  drawParts();

  // shake
  if (shakeAmt > 0){
    var sx = (Math.random()-0.5)*2*shakeAmt*9;
    var sy = (Math.random()-0.5)*2*shakeAmt*9;
    var rot = (Math.random()-0.5)*shakeAmt*0.6;
    stage.style.transform = "translate("+sx.toFixed(2)+"px,"+sy.toFixed(2)+"px) rotate("+rot.toFixed(2)+"deg)";
  } else if (stage.style.transform){
    stage.style.transform = "";
  }
}

function frame(now){
  var dt = (now - lastFrame)/1000;
  lastFrame = now;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(dt, 0.05);

  update(dt);

  // gauge text
  if (phase === "charging" || phase === "resolve" || phase === "ready"){
    var e = (phase==="charging") ? ES : (phase==="resolve" ? ES : 0);
    pctVal.textContent = (Math.min(e,100)).toFixed(1);
    var mul = (e*e/100);
    multEl.textContent = "MULTI ×" + mul.toFixed(1);
    var baseNow = Math.floor(e*e*4 + e*20);
    var potNow = Math.floor(baseNow * tierOf(e).mul);
    potEl.textContent = "+" + fmt(potNow);

    // color of percent
    var t = clamp(e/100,0,1);
    var hueT = lerp(190,352,Math.pow(t,2.2));
    pctVal.parentNode.style.color = "hsl(" + hueT + "," + (100-t*62) + "%," + (96 - t*3) + "%)";
    pctVal.parentNode.style.textShadow = "0 2px 16px rgba(0,0,0,.65), 0 0 34px hsla(" + hueT + ",100%,60%," + (0.45+t*0.55) + ")";
    multEl.style.color = (phase==="resolve" && ES>=BUST) ? "#4a627a"
      : t > 0.7 ? "hsl("+lerp(150,50,(t-0.7)/0.3)+",100%,"+(70+t*22)+"%)" : "#7bffce";
    zoneNote.style.visibility = (phase === "ready") ? "visible" : "hidden";
    holdHint.style.visibility = (phase === "ready" || phase === "charging") ? "visible" : "hidden";

    // danger cue
    if (phase === "charging"){
      if (e >= 95){
        holdHint.textContent = "離せ！！";
        holdHint.className = "danger";
        vignette.style.opacity = 0.14 + 0.40*clamp((e-95)/5,0,1);
      } else if (e >= 85){
        holdHint.textContent = "まだ…まだ…";
        holdHint.className = "hold";
        vignette.style.opacity = 0.12;
      } else if (e >= 40){
        holdHint.textContent = "溜まってる…";
        holdHint.className = "hold";
        vignette.style.opacity = 0;
      }
    } else if (phase === "ready"){
      holdHint.textContent = "長押しで溜める";
      holdHint.className = "";
      vignette.style.opacity = 0;
    }
  }

  if (phase === "resolve" || phase === "result" || phase === "title"){
    vignette.style.opacity = (phase==="resolve" && busts && ES>=BUST) ? 1 : 0;
  }

  draw();
  requestAnimationFrame(frame);
}

/* =====================================================================
   WIRING
   ===================================================================== */
function bindHold(el){
  el.addEventListener("pointerdown", function(ev){
    if (ev.button != null && ev.button > 0) return;
    if (ev.target && ev.target.closest && ev.target.closest("#hud")) return;
    pd = true;
    if (phase !== "ready" && phase !== "charging") return;
    ev.preventDefault();
    if (ev.pointerId != null && el.setPointerCapture){
      try { el.setPointerCapture(ev.pointerId); } catch(e){}
    }
    beginHold();
  }, {passive:false});
  el.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });
}
bindHold(stage);
window.addEventListener("pointerup", function(ev){ pd = false; endHold(); }, {passive:true});
window.addEventListener("pointercancel", function(ev){ pd = false; endHold(); }, {passive:true});
window.addEventListener("blur", function(){ if (phase==="charging") endHold(); });

document.addEventListener("keydown", function(ev){
  if (ev.code === "Space" || ev.key === " "){
    ev.preventDefault();
    if (ev.repeat) return;
    ensureAudio();
    beginHold();
  }
});
document.addEventListener("keyup", function(ev){
  if (ev.code === "Space" || ev.key === " "){
    ev.preventDefault();
    endHold();
  }
});
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

$("#startBtn").addEventListener("click", function(ev){
  ev.preventDefault();
  ensureAudio();
  sfxUIClick();
  hide(scrTitle);
  startGame();
});

muteBtn.addEventListener("click", function(ev){
  ev.stopPropagation();
  ev.preventDefault();
  muted = !muted;
  store.muted = muted; saveStore();
  muteBtn.textContent = muted ? "🔇" : "🔊";
  if (muted) { stopChargeSound(true); if (master) master.gain.value = 0; }
  else { if (master) master.gain.value = 0.8; ensureAudio(); sfxUIClick(); }
});

// best line
function refreshBest(){
  if (store.best > 0 || store.bestPrec > 0){
    $("#bestLine").innerHTML = "自己ベスト <b>" + fmt(store.best) + "</b> ／ 最高ギリギリ <b>" + store.bestPrec.toFixed(1) + "%</b>";
  } else {
    $("#bestLine").innerHTML = "自己ベスト記録なし — 初回プレイで記録更新";
  }
}

/* init */
muteBtn.textContent = muted ? "🔇" : "🔊";
if (muted && master) master.gain.value = 0;
resize();
refreshBest();
resetHUD();
gaugeBox.style.display = "none";
hud.classList.add("off");
lastFrame = performance.now();
requestAnimationFrame(frame);

})();
</script>
