var AU={ctx:null,master:null,muted:false};

/* ink coverage measurement */
var inkCache={};
function measureInk(ch){
  if(inkCache[ch]) return inkCache[ch];
  var c=document.createElement("canvas"); c.width=64; c.height=64;
  var g=c.getContext("2d");
  g.fillStyle="#000"; g.fillRect(0,0,64,64);
  g.fillStyle="#fff";
  g.font='54px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  g.textAlign="center"; g.textBaseline="middle";
  g.fillText(ch,32,34);
  var d=g.getImageData(0,0,64,64).data, count=0, minX=64,minY=64,maxX=0,maxY=0;
  for(var y=0;y<64;y++) for(var x=0;x<64;x++){
    var v=d[(y*64+x)*4];
    if(v>110){ count++; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  }
  var cov=count/(64*64);
  var bw=maxX-minX+1, bh=maxY-minY+1;
  var res={cov:cov, bw:bw, bh:bh, fill:count/Math.max(1,bw*bh)};
  inkCache[ch]=res; return res;
}
function strokeCount(ch){
  if(STROKES[ch]!=null) return {n:STROKES[ch], exact:true};
  var cp=ch.codePointAt(0)||20000;
  return {n:6+(cp%14), exact:false};
}
function statsFor(ch){
  var s=strokeCount(ch), ink=measureInk(ch);
  var weight=Math.round(38 + s.n*4.6 + ink.cov*260);
  var spike=clamp(0.25 + s.n*0.028 + ink.fill*0.55, 0.2, 1.6);
  var spin=clamp(0.5 + ink.cov*4 + (s.n%5)*0.18, 0.4, 2.2);
  var radius=clamp(26 + s.n*0.72, 26, 46);
  return {ch:ch, strokes:s, ink:ink, mass:weight, spike:spike, spin:spin, r:radius};
}

function makeKoma(st,isPlayer){
  return {x:0,y:0,vx:0,vy:0,r:st.r,mass:st.mass,spike:st.spike,spin:st.spin,
          ang:rnd(0,6.28),avel:rnd(-0.6,0.6),stats:st,player:isPlayer,
          scale:1,dead:false, glow:isPlayer?1:0, hitFlash:0};

/* ---------------- particles ---------------- */
function sparks(x,y,n,color,power){
  for(var i=0;i<n;i++){
    var a=rnd(0,6.2832), sp=rnd(60,520)*(power||1);
    aState.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:rnd(0.25,0.75),max:0.75,size:rnd(1.2,3.6),color:color||"#ffd27a"});
  }
}
function floatText(x,y,txt,color,size){

}
function stepFx(dt){
  for(var i=aState.particles.length-1;i>=0;i--){
    var p=aState.particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.pow(0.02,dt); p.vy*=Math.pow(0.02,dt);
    p.life-=dt; if(p.life<=0) aState.particles.splice(i,1);
  }
  for(var j=aState.texts.length-1;j>=0;j--){
    var t=aState.texts[j]; t.y-=42*dt; t.life-=dt;
    if(t.life<=0) aState.texts.splice(j,1);
  }
}

function arenaInputMove(x,y){
  if(!drag||aState.phase!=="play") return;
  drag.lastX=x; drag.lastY=y;
  var dx=x-drag.x0, dy=y-drag.y0, d=Math.hypot(dx,dy);

  var dx=x-drag.x0, dy=y-drag.y0, d=Math.hypot(dx,dy), dt=performance.now()-drag.t;
  aState.aim=null;

function playerDash(dx,dy,power){

  var dv=630*power*Math.pow(80/p.mass,0.35);

  if(sp>720){ p.vx=p.vx/sp*720; p.vy=p.vy/sp*720; }
  p.avel+=rnd(-2,2)*power;
  sfxSwipe();
  elHint.style.opacity="0";
  sparks(p.x,p.y,6,"#ffb066",0.6);
  floatText(p.x,p.y-p.r-10,"突",'#ffd469',14);
}
function playerDashToEnemy(){

  var dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;

}

function startRun(){

function nextBattle(first){
  aState.phase="count"; aState.count=first?1.9:1.5; aState.t=0;
  aState.particles.length=0; aState.texts.length=0;
  aState.hitStop=0; aState.shake=0; aState.flash=0; aState.slowmo=1;
  aState.winner=null; aState.overT=0;
  var eCh=ENEMY_POOL[Math.min(ENEMY_POOL.length-1, aState.streak+ri(0,2))];
  if(aState.streak===0) eCh="虎";

  // scale enemy with streak
  var k=1+aState.streak*0.14;
  eStats.mass=Math.round(eStats.mass*k);
  eStats.spike=clamp(eStats.spike*(1+aState.streak*0.03),0.2,2.0);
  var p=makeKoma(myStats,true), e=makeKoma(eStats,false);
  var R=ARENA.r;
  p.x=ARENA.cx; p.y=ARENA.cy+R*0.30;
  e.x=ARENA.cx; e.y=ARENA.cy-R*0.30;

}

/* ---------------- physics ---------------- */
function stepKoma(k,dt){
  if(k.dead) return;
  k.x+=k.vx*dt; k.y+=k.vy*dt;
  k.ang+=k.avel*dt;
  var fr=Math.exp(-3.2*dt);
  k.vx*=fr; k.vy*=fr; k.avel*=Math.exp(-1.6*dt);
  k.hitFlash=Math.max(0,k.hitFlash-dt*3);
}
function collide(a,b){
  var dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r;
  if(d===0||d>=min) return;
  var nx=dx/d, ny=dy/d;
  var overlap=min-d;
  var ma=a.mass, mb=b.mass, tot=ma+mb;
  a.x-=nx*overlap*(mb/tot); a.y-=ny*overlap*(mb/tot);
  b.x+=nx*overlap*(ma/tot); b.y+=ny*overlap*(ma/tot);
  var rvx=b.vx-a.vx, rvy=b.vy-a.vy;
  var vn=rvx*nx+rvy*ny;
  if(vn>0) return; // separating
  var e=0.50+(a.spike+b.spike)*0.20;
  var j=-(1+e)*vn/(1/ma+1/mb);
  a.vx-=j*nx/ma; a.vy-=j*ny/ma;
  b.vx+=j*nx/mb; b.vy+=j*ny/mb;
  // tangential spin
  var tx=-ny,ty=nx, vt=rvx*tx+rvy*ty;
  a.avel-=vt*0.0035; b.avel+=vt*0.0035;
  var power=Math.min(1.6,Math.abs(vn)/600);
  if(power>0.12){
    var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    sparks(mx,my,Math.floor(8+power*18),"#ffcf8a",1+power);
    aState.shake=Math.max(aState.shake,6+power*14);
    aState.hitStop=Math.max(aState.hitStop,0.03+power*0.06);
    sfxHit(power);
    var dmg=Math.abs(vn);
    if(dmg>aState.bestHit) aState.bestHit=dmg;
    floatText(mx,my-16, dmg>900?"ドゴッ":"ガツン", '#fff', 16+power*12);
    a.hitFlash=1; b.hitFlash=1;
  }
}
function outOfRing(k){
  var dx=k.x-ARENA.cx, dy=k.y-ARENA.cy;
  return Math.hypot(dx,dy)>ARENA.r+k.r*0.85;
}

/* AI */
function cpuStep(dt){
  var e=aState.enemy,p=aState.player;
  if(!e||!p||aState.phase!=="play") return;
  aState.enemyTimer-=dt;
  if(aState.enemyCharge>0){
    aState.enemyCharge-=dt;
    if(aState.enemyCharge<=0){
      // charge dash toward player
      var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
      var pw=0.9+aState.streak*0.03;
      var dv=680*pw*Math.pow(80/e.mass,0.35);
      e.vx+=dx/d*dv; e.vy+=dy/d*dv; e.avel+=rnd(-3,3);
      sparks(e.x,e.y,10,"#ff8a6a",0.8);
      sfxSwipe();
    }
    return;
  }
  if(aState.enemyTimer>0) return;
  aState.enemyTimer=Math.max(0.30,1.05/(1+aState.streak*0.09))+rnd(-0.1,0.2);
  var distCenter=Math.hypot(e.x-ARENA.cx,e.y-ARENA.cy);
  if(distCenter>ARENA.r*0.72){
    // escape inward
    var ax=ARENA.cx-e.x, ay=ARENA.cy-e.y, ad=Math.hypot(ax,ay)||1;
    var dv=600*Math.pow(80/e.mass,0.35);
    e.vx+=ax/ad*dv; e.vy+=ay/ad*dv;
    return;
  }
  var r=Math.random();
  if(r<0.32+aState.streak*0.02){ aState.enemyCharge=0.34; sfxCharge(); showWarn(); return; }
  var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  var side=(Math.random()<0.5?-1:1);
  var ang=Math.atan2(dy,dx)+side*0.36;
  var pw=(0.70+Math.random()*0.35)*(1+aState.streak*0.03);
  var dv=740*pw*Math.pow(80/e.mass,0.35);
  e.vx+=Math.cos(ang)*dv; e.vy+=Math.sin(ang)*dv;
};

/* ---------------- render ---------------- */
function drawArena(){
  var R=ARENA.r;
  // outer platform
  ctx.save();
  var g=ctx.createRadialGradient(ARENA.cx,ARENA.cy-R*0.3,R*0.2,ARENA.cx,ARENA.cy,R*1.15);
  g.addColorStop(0,"#3a2318"); g.addColorStop(0.72,"#24140e"); g.addColorStop(1,"#0b0605");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ARENA.cx,ARENA.cy,R*1.15,0,6.2832); ctx.fill();

  // sand
  var s=ctx.createRadialGradient(ARENA.cx-R*0.25,ARENA.cy-R*0.3,R*0.1,ARENA.cx,ARENA.cy,R);
  s.addColorStop(0,"#e0bd8a"); s.addColorStop(0.6,"#c79a63"); s.addColorStop(1,"#9c7245");
  ctx.fillStyle=s; ctx.beginPath(); ctx.arc(ARENA.cx,ARENA.cy,R,0,6.2832); ctx.fill();

  // raked texture rings
  ctx.strokeStyle="rgba(120,80,40,.13)"; ctx.lineWidth=1;
  for(var i=1;i<=9;i++){
    ctx.beginPath(); ctx.arc(ARENA.cx,ARENA.cy,R*i/10,0,6.2832); ctx.stroke();
  }
  // center lines
  ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(ARENA.cx-R*0.34,ARENA.cy); ctx.lineTo(ARENA.cx-R*0.10,ARENA.cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ARENA.cx+R*0.10,ARENA.cy); ctx.lineTo(ARENA.cx+R*0.34,ARENA.cy); ctx.stroke();

  // straw bales around edge
  var n=34;
  for(var k=0;k<n;k++){
    var a=k/n*6.2832;
    var x=ARENA.cx+Math.cos(a)*R, y=ARENA.cy+Math.sin(a)*R;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2);
    var bg=ctx.createLinearGradient(0,-5,0,5);
    bg.addColorStop(0,"#d8b578"); bg.addColorStop(0.5,"#b8905a"); bg.addColorStop(1,"#8a6738");
    ctx.fillStyle=bg;
    if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(-R*0.093,-5,R*0.186,10,4); ctx.fill(); }
    else ctx.fillRect(-R*0.093,-5,R*0.186,10);
    ctx.strokeStyle="rgba(80,50,25,.35)"; ctx.lineWidth=0.8; ctx.stroke();
    ctx.restore();
  }

  // glow rim
  ctx.strokeStyle="rgba(255,180,90,.35)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ARENA.cx,ARENA.cy,R+3,0,6.2832); ctx.stroke();
  ctx.restore();
}

function drawDohyoDecor(){
  // soft shadow under the ring
  var sh=ctx.createRadialGradient(ARENA.cx,ARENA.cy+ARENA.r*0.92,ARENA.r*0.2,ARENA.cx,ARENA.cy+ARENA.r*0.92,ARENA.r*1.15);
  sh.addColorStop(0,"rgba(0,0,0,.55)"); sh.addColorStop(1,"rgba(0,0,0,0)");

function drawKoma(k){
  if(!k) return;
  var r=k.r, st=k.stats;
  ctx.save();
  ctx.translate(k.x,k.y);
  if(k.scale<1) ctx.scale(Math.max(0.01,k.scale),Math.max(0.01,k.scale));

  // shadow
  ctx.save();
  ctx.globalAlpha=0.34; ctx.fillStyle="#000";
  ctx.beginPath(); ctx.ellipse(5,8,r,r*0.94,0,0,6.2832); ctx.fill();
  ctx.restore();

  ctx.rotate(k.ang);

  // spikes
  var spCount=8+Math.round(st.strokes.n*0.8);
  for(var i=0;i<spCount;i++){
    var a=i/spCount*6.2832;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0,-r*0.9); ctx.lineTo(r*0.16,-r*(1.14+st.spike*0.22)); ctx.lineTo(r*0.34,-r*0.86);
    ctx.closePath();
    ctx.fillStyle=k.player? (k.hitFlash>0?"#fff3c4":"#e8b44a") : (k.hitFlash>0?"#ffdcdc":"#c8452e");
    ctx.fill();
    ctx.restore();
  }

  // disc
  var grd=ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.15,0,0,r);
  if(k.player){ grd.addColorStop(0,"#fff6dd"); grd.addColorStop(0.45,"#ffd98a"); grd.addColorStop(1,"#b06a15"); }
  else { grd.addColorStop(0,"#ffdede"); grd.addColorStop(0.45,"#e0705a"); grd.addColorStop(1,"#5e170f"); }
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(0,0,r*0.86,0,6.2832); ctx.fill();
  ctx.lineWidth=2.2; ctx.strokeStyle=k.player?"#7a4a08":"#3c0d07"; ctx.stroke();
  if(k.hitFlash>0){
    ctx.globalAlpha=k.hitFlash*0.85; ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(0,0,r*0.86,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
  }

  // glyph
  ctx.rotate(-k.ang*0.35); // partial counter-spin keeps it legible
  ctx.fillStyle=k.player?"#2a1503":"#2a0503";
  ctx.font='700 '+(r*1.16)+'px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(st.ch,0,r*0.04);
  ctx.restore();

  // player marker ring
  if(k.player){
    var _dd=Math.hypot(k.x-ARENA.cx,k.y-ARENA.cy);
    var _danger=clamp((_dd-ARENA.r*0.62)/(ARENA.r*0.35),0,1);
    ctx.save();
    ctx.strokeStyle=_danger>0.05?"rgba(255,"+(200-_danger*120)+",90,"+(0.6+Math.sin(aState.t*14)*0.3)+")":"rgba(255,220,140,"+(0.55+Math.sin(aState.t*6)*0.18)+")";
    ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.arc(k.x,k.y,r*1.28,0,6.2832); ctx.stroke();
    ctx.restore();
  }
  // charge warning
  if(!k.player && aState.enemyCharge>0){
    ctx.save();
    ctx.globalAlpha=0.55+Math.sin(aState.t*30)*0.3;
    ctx.strokeStyle="#ff2b4d"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(k.x,k.y,r*1.4,0,6.2832); ctx.stroke();
    ctx.restore();
  }
}

function drawAim(){
  if(!aState.aim||!aState.player) return;
  var p=aState.player;
  ctx.save();
  ctx.strokeStyle="rgba(255,220,150,.65)"; ctx.lineWidth=3; ctx.setLineDash([8,7]);
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(aState.aim.x,aState.aim.y); ctx.stroke();
  ctx.restore();
}

function render(){
  // background
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#150a0c"); bg.addColorStop(0.5,"#1d0f10"); bg.addColorStop(1,"#080405");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // dojo floor
  var fg=ctx.createLinearGradient(0,H*0.05,0,H);
  fg.addColorStop(0,"rgba(70,34,20,.35)"); fg.addColorStop(1,"rgba(14,6,5,.7)");
  ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,170,100,.045)"; ctx.lineWidth=1;
  for(var _i=0;_i<15;_i++){
    var _y=H*0.10+_i*(H*0.062);
    ctx.beginPath(); ctx.moveTo(0,_y); ctx.lineTo(W,_y+H*0.035); ctx.stroke();
  }
  // top spotlights
  for(var _s=0;_s<2;_s++){
    var _sx=_s?W*0.8:W*0.2;
    var sg=ctx.createLinearGradient(_sx,0,ARENA.cx,ARENA.cy);
    sg.addColorStop(0,"rgba(255,200,140,.10)"); sg.addColorStop(1,"rgba(255,170,90,0)");
    ctx.fillStyle=sg; ctx.beginPath();
    ctx.moveTo(_sx-18,0); ctx.lineTo(_sx+18,0);
    ctx.lineTo(ARENA.cx+(_s?ARENA.r*0.95:-ARENA.r*0.95),ARENA.cy+ARENA.r*0.85);
    ctx.closePath(); ctx.fill();
  }

  // ambient glow behind arena
  var ag=ctx.createRadialGradient(ARENA.cx,ARENA.cy,ARENA.r*0.3,ARENA.cx,ARENA.cy,ARENA.r*1.5);
  ag.addColorStop(0,"rgba(255,120,50,.16)"); ag.addColorStop(1,"rgba(255,80,20,0)");
  ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(ARENA.cx,ARENA.cy,ARENA.r*1.5,0,6.2832); ctx.fill();

  ctx.save();
  if(aState.shake>0.4){
    ctx.translate((Math.random()-0.5)*aState.shake,(Math.random()-0.5)*aState.shake);
  }

  drawArena();
  drawDohyoDecor();
  drawAim();
  if(aState.enemy) drawKoma(aState.enemy);
  if(aState.player) drawKoma(aState.player);

  // particles
  for(var i=0;i<aState.particles.length;i++){
    var p=aState.particles[i];
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;
  // texts
  for(var j=0;j<aState.texts.length;j++){
    var tx=aState.texts[j];
    ctx.globalAlpha=clamp(tx.life/tx.max,0,1);
    ctx.font='900 '+tx.size+'px "Hiragino Sans","Noto Sans JP",sans-serif';
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineWidth=3; ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.strokeText(tx.txt,tx.x,tx.y);
    ctx.fillStyle=tx.color; ctx.fillText(tx.txt,tx.x,tx.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // countdown
  if(aState.phase==="count"){
    var c=Math.ceil(aState.count);
    ctx.save();
    ctx.globalAlpha=0.9;
    ctx.font='900 '+(96+Math.sin(aState.t*12)*8)+'px "Hiragino Sans",sans-serif';
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="rgba(255,220,150,.95)";
    ctx.shadowColor="#ff8a2b"; ctx.shadowBlur=30;
    ctx.fillText(c>0?String(c):"",ARENA.cx,H*0.42);
    ctx.restore();
  }

  // flash
  if(aState.flash>0.01){
    ctx.fillStyle="rgba(255,240,220,"+clamp(aState.flash,0,1)+")";
    ctx.fillRect(0,0,W,H);
  }

  // speed lines during slowmo? subtle vignette
  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.45)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ---------------- loop ---------------- */
var lastT=0;
function loop(ts){
  if(!lastT) lastT=ts;
  var raw=Math.min(0.05,(ts-lastT)/1000); lastT=ts;

  var dt=raw;
  if(aState.hitStop>0){ aState.hitStop-=raw; dt=raw*0.06; }
  if(aState.phase==="over"){ aState.slowmo=Math.min(1,aState.slowmo+raw*1.4); dt*=aState.slowmo; }
  aState.t+=dt;

  if(aState.phase==="count"){
    aState.count-=dt;
    if(aState.count<=0) beginPlay();
  } else if(aState.phase==="play"||aState.phase==="over"){
    var p=aState.player,e=aState.enemy;
    if(p&&e){
      if(aState.phase==="play"){
        cpuStep(dt);
        aState.battleTime+=dt;
        if(aState.battleTime>20){
          var dp=Math.hypot(p.x-ARENA.cx,p.y-ARENA.cy), de=Math.hypot(e.x-ARENA.cx,e.y-ARENA.cy);
          showCallout("時間切れ","TIME UP");
          if(dp>=de){ p.dead=true; } else { e.dead=true; }
          endBattle(dp>=de?"enemy":"player");
        }
      }
      stepKoma(p,dt); stepKoma(e,dt);
      // ring boundary force: soft wall? No — permit going out to lose.
      collide(p,e);
      if(aState.phase==="play"){
        if(outOfRing(p)){ p.dead=true; p.vx*=1.5; p.vy*=1.5; endBattle("enemy"); }
        else if(outOfRing(e)){ e.dead=true; e.vx*=1.5; e.vy*=1.5; endBattle("player"); }
      }
      // falling animation
      if(p.dead){ p.scale=Math.max(0,p.scale-dt*1.6); p.x+=p.vx*dt*0.3; p.y+=p.vy*dt*0.3; }
      if(e.dead){ e.scale=Math.max(0,e.scale-dt*1.6); e.x+=e.vx*dt*0.3; e.y+=e.vy*dt*0.3; }
    }
    if(aState.phase==="over"){
      aState.overT+=raw;
      if(aState.overT>0.55){
        if(aState.winner==="player"){
          if(aState.overT>1.55){
            aState.slowmo=1;
            if(aState.streak>=10){ toResult(); }
            else { nextBattle(false); }
          }
        } else {
          if(aState.overT>1.7){ toResult(); }
        }
      }
    }
  }

  aState.shake*=Math.pow(0.0015,raw);
  aState.flash=Math.max(0,aState.flash-raw*2.2);
  stepFx(raw);
  render();
  requestAnimationFrame(loop);
}

/* ---------------- UI wiring ---------------- */
var input=$("#kanjiInput");
function setKanji(ch){
  if(!ch) return;
  ch=Array.from(ch)[0]||"龍";
  if(/\s/.test(ch)) return;
  myKanji=ch; myStats=statsFor(ch);
  input.value=ch;
  $("#kStrokes").textContent=myStats.strokes.n+(myStats.strokes.exact?"画":"画(推)");
  $("#kWeight").textContent=myStats.mass;
  $("#kSpike").textContent=myStats.spike.toFixed(2);
  $("#kSpin").textContent=myStats.spin.toFixed(2);
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-k]"),function(el){
    el.classList.toggle("sel",el.getAttribute("data-k")===ch);
  });
  try{ localStorage.setItem(LS_KANJI,ch); }catch(e){}
}
function buildPresets(){
  var wrap=$("#presets");
  PRESETS.forEach(function(ch){
    var b=document.createElement("button");
    b.className="chip"; b.textContent=ch; b.setAttribute("data-k",ch);
    b.addEventListener("pointerdown",function(e){ e.stopPropagation(); });
    b.addEventListener("click",function(e){ e.stopPropagation(); audioOn(); setKanji(ch); tone({type:"triangle",f:620,dur:0.06,v:0.08}); });
    wrap.appendChild(b);
  });
  var dice=document.createElement("button");
  dice.className="chip dice"; dice.textContent="おまかせ";
  dice.addEventListener("click",function(e){
    e.stopPropagation(); audioOn();
    var pool=Object.keys(STROKES); setKanji(pool[ri(0,pool.length-1)]);
    tone({type:"square",f:400,to:900,dur:0.1,v:0.08});
  });
  wrap.appendChild(dice);
}
input.addEventListener("input",function(){
  var v=input.value; if(!v) return;
  setKanji(Array.from(v)[0]);
});
input.addEventListener("click",function(e){ e.stopPropagation(); audioOn(); });

function onTap(el,fn){
  var last=0;
  el.addEventListener("pointerdown",function(e){e.stopPropagation()});
  el.addEventListener("touchstart",function(e){e.stopPropagation()},{passive:true});
  el.addEventListener("click",function(e){
    e.stopPropagation();
    var t=performance.now(); if(t-last<330) return; last=t; fn();
  });
}
onTap($("#startBtn"),function(){
  if(!myStats) setKanji(myKanji||"龍");
  startRun();
});
onTap($("#retryBtn"),function(){ startRun(); });
onTap($("#changeBtn"),function(){
  scrResult.classList.add("hide"); scrTitle.classList.remove("hide");
  elHud.classList.add("off"); aState.phase="idle";
});
onTap($("#shareBtn"),function(){
  audioOn();
  var txt="漢字『"+myKanji+"』で "+aState.streak+"連勝。\n"
        +"称号：「"+titleFor(aState.streak)+"」／最大ヒット "+Math.round(aState.bestHit)+"\n"
        +"好きな漢字1文字がそのまま武器になる。お前の一文字は？";
  var url=gameUrl();
  var u="https://twitter.com/intent/tweet?text="+encodeURIComponent(txt)
      +(url?"&url="+encodeURIComponent(url):"")
      +"&hashtags="+encodeURIComponent("漢字ブレード,バカゲー");
  window.open(u,"_blank");
});
function gameUrl(){
  if(/^https?:/.test(location.protocol)) return location.href.split("#")[0];
  return "https://xiudengyouhe22-eng.github.io/kanji-blade/";
}

/* ---------------- init ---------------- */
buildPresets();
try{ var saved=localStorage.getItem(LS_KANJI); if(saved) myKanji=saved; }catch(e){}
setKanji(myKanji);
try{
  var b=parseInt(localStorage.getItem(LS_BEST)||"0",10)||0;
  if(b>0) $("#bestTxt").textContent="最高連勝： "+b;
}catch(e){}
resize();
requestAnimationFrame(loop);

window.__dbg=function(){
  var p=aState.player,e=aState.enemy;
  return {phase:aState.phase,streak:aState.streak,kills:aState.kills,
    pw:p?{x:+p.x.toFixed(1),y:+p.y.toFixed(1),vx:+p.vx.toFixed(1),vy:+p.vy.toFixed(1)}:null,
    en:e?{x:+e.x.toFixed(1),y:+e.y.toFixed(1),ch:e.stats.ch,mass:e.mass}:null,
    kanji:myKanji, mass:myStats?myStats.mass:0, bestHit:Math.round(aState.bestHit),
    arena:{cx:ARENA.cx,cy:ARENA.cy,r:ARENA.r}};
};
})();
</script>
