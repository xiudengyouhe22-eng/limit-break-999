<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>0.01秒の脳汁居合斬り｜全5戦</title>
<meta name="description" content="画面が「!!」と赤く光った瞬間にタップ。0.12秒以内ならキュイン♪虹フラッシュ＋ヒットストップで相手が真っ二つ。お手付き即敗北の極限居合、全5戦。">
<meta name="theme-color" content="#0a0208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="居合斬り">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#0a0208;color:#fff;overflow:hidden;overscroll-behavior:none;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  #hud{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:flex-start;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0 16px;pointer-events:none;transition:opacity .25s;}
  #hud.off{opacity:0;}
  .lbl{font-size:9px;letter-spacing:.26em;color:#a57f8f;font-weight:700;}
  #roundTxt{font-size:15px;font-weight:900;letter-spacing:.1em;color:#fff;}
  #dots{display:flex;gap:6px;margin-top:6px;}
  .dot{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);transition:all .25s;}
  .dot.win{background:#ff2a4d;box-shadow:0 0 10px #ff2a4d;}
  .dot.now{background:#fff;box-shadow:0 0 12px #fff;}
  .dot.lose{background:#4a4a4a;}
  #muteBtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);color:#ffc9d6;font-size:15px;}
  #muteBtn:active{transform:scale(.92);}

  .screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:calc(64px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity .25s;
    background:radial-gradient(ellipse at 50% 45%,rgba(90,0,25,.5) 0%,rgba(10,2,8,.93) 62%,#0a0208 100%);}
  .screen.show{opacity:1;pointer-events:auto;}
  .logo{text-align:center;line-height:1;margin-bottom:4px;}
  .logo .kanji{font-size:clamp(60px,18vw,92px);font-weight:900;line-height:1;
    background:linear-gradient(180deg,#fff 0%,#ff2a4d 60%,#7a0018 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,42,77,.55));}
  .logo .sub{display:block;margin-top:10px;font-size:12px;letter-spacing:.34em;color:#ffc9d6;font-weight:800;text-indent:.34em;}
  .logo .tag{display:block;margin-top:4px;font-size:10px;letter-spacing:.24em;color:#a57f8f;font-weight:700;}
  .rules{font-size:12px;line-height:1.85;color:#d8bcc6;text-align:center;background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 16px;max-width:330px;}
  .rules b{color:#ffe600;}
  .rules .red{color:#ff2a4d;font-weight:800;}
  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:14px;padding:16px 40px;
    font-size:17px;letter-spacing:.1em;background:linear-gradient(135deg,#ff2a4d,#a3001f);color:#fff;
    box-shadow:0 10px 30px rgba(255,42,77,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s;}
  .btn:active{transform:scale(.95);}
  .btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);box-shadow:none;color:#ffd4dd;font-size:14px;padding:13px 28px;}
  .btn.share{background:#0b0b0b;border:1px solid rgba(255,255,255,.35);box-shadow:none;font-size:15px;padding:14px 28px;}

  #rAvg{font-size:clamp(50px,16vw,74px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(180deg,#fff,#ffe600 55%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(255,190,0,.5));}
  #rAvg small{font-size:.32em;-webkit-text-fill-color:#ffc9d6;margin-left:4px;}
  #rRank{font-size:20px;font-weight:900;color:#ff2a4d;text-shadow:0 0 18px rgba(255,42,77,.7);}
  #rStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:330px;}
  .stat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 4px;text-align:center;}
  .stat .k{font-size:9px;color:#a57f8f;letter-spacing:.1em;font-weight:700;}
  .stat .v{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px;}
  #rComment{font-size:12px;color:#d8bcc6;text-align:center;max-width:320px;line-height:1.7;min-height:34px;}

  #calligraphy{position:absolute;left:0;right:0;top:30%;z-index:7;text-align:center;pointer-events:none;opacity:0;}
  #calligraphy.on{animation:calli 1.1s cubic-bezier(.2,1.6,.3,1) forwards;}
  #calligraphy .k{font-size:clamp(80px,26vw,140px);font-weight:900;line-height:1;color:#fff;
    text-shadow:0 0 30px rgba(255,42,77,.9),0 0 70px rgba(255,0,60,.5);}
  @keyframes calli{0%{opacity:0;transform:scale(1.8) rotate(-8deg)}18%{opacity:1;transform:scale(1) rotate(-4deg)}
    70%{opacity:1}100%{opacity:0;transform:scale(1.05) rotate(-4deg)}}

  #banner{position:absolute;left:0;right:0;top:17%;z-index:7;text-align:center;pointer-events:none;opacity:0;}
  #banner.on{animation:bn 1.5s ease-out forwards;}
  #banner .tx{display:inline-block;font-size:15px;font-weight:900;letter-spacing:.3em;color:#fff;padding:6px 18px;
    border-top:1px solid rgba(255,42,77,.8);border-bottom:1px solid rgba(255,42,77,.8);background:rgba(0,0,0,.4);}
  @keyframes bn{0%{opacity:0;transform:translateY(-10px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

  #reaction{position:absolute;left:0;right:0;top:52%;z-index:8;text-align:center;pointer-events:none;opacity:0;}
  #reaction.on{animation:react 1.4s ease-out forwards;}
  #reaction .v{font-size:clamp(48px,15vw,72px);font-weight:900;font-variant-numeric:tabular-nums;color:#fff;
    text-shadow:0 0 10px #fff,0 0 30px rgba(0,229,255,.95),0 0 60px rgba(0,229,255,.5);}
  #reaction .t{font-size:12px;letter-spacing:.3em;color:#8fe8ff;font-weight:800;}
  @keyframes react{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:9;}
  #flash.on{animation:fo .4s ease-out forwards;}
  #flash.red{background:#ff0022;}
  #flash.red.on{animation:fred .22s ease-out forwards;}
  @keyframes fred{0%{opacity:.38}55%{opacity:.16}100%{opacity:0}}
  #flash.rain{background:linear-gradient(120deg,#ff004c,#ffe600,#00ff9d,#00a6ff,#c400ff);}
  @keyframes fo{0%{opacity:.92}100%{opacity:0}}

  #hint{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;
    font-size:12px;letter-spacing:.18em;color:#c9a3b0;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx"></canvas>

  <div id="hud" class="off">
    <div>
      <div class="lbl">ROUND</div>
      <div id="roundTxt">1 / 5</div>
      <div id="dots"></div>
    </div>
    <button id="muteBtn" aria-label="サウンド切替">🔊</button>
  </div>

  <div id="hint">合図が出たら画面をタップ</div>
  <div id="banner"><span class="tx"></span></div>
  <div id="calligraphy"><div class="k">斬</div></div>
  <div id="reaction"><div class="v">0.000</div><div class="t">SECONDS</div></div>

  <div id="scrTitle" class="screen show">
    <div class="logo">
      <span class="kanji">居合斬り</span>
      <span class="sub">0.01秒の脳汁</span>
      <span class="tag">IAI SLASH ─ 全5戦</span>
    </div>
    <div class="rules">
      画面が<span class="red">「!!」</span>と赤く光った瞬間、<br>
      即タップ。<b>0.12秒以内</b>なら神速斬り。<br>
      虹フラッシュ＋ヒットストップで<br>
      相手が物理演算で真っ二つ。<br>
      <span class="red">合図前のタップは即敗北。</span><br>
      5人の剣士を斬り抜け。
    </div>
    <button class="btn" id="startBtn">勝負</button>
      <a class="pkl-arcade-link" href="../arcade/" style="display:inline-block;margin-top:12px;padding:7px 14px;border-radius:99px;border:1px solid rgba(140,210,255,.38);background:rgba(8,16,32,.55);color:#9fd8ff;font-size:11px;font-weight:700;letter-spacing:.04em;text-decoration:none;opacity:.8;pointer-events:auto;line-height:1.3;-webkit-tap-highlight-color:transparent;">🎮 他の脳汁ゲームも遊ぶ（全11本）</a>
  </div>

  <div id="scrResult" class="screen">
    <div class="lbl" style="letter-spacing:.34em">RESULT</div>
    <div id="rAvg">0.000<small>s</small></div>
    <div id="rRank">—</div>
    <div id="rStats">
      <div class="stat"><div class="k">最高速度</div><div class="v" id="rBest">—</div></div>
      <div class="stat"><div class="k">撃破</div><div class="v" id="rKills">0 / 5</div></div>
      <div class="stat"><div class="k">神速(0.12秒内)</div><div class="v" id="rPerfect">0</div></div>
    </div>
    <div id="rComment"></div>
    <button class="btn share" id="shareBtn">𝕏 で反応速度をシェア</button>
    <button class="btn ghost" id="retryBtn">もう一度勝負</button>
      <a class="pkl-arcade-link" href="../arcade/" style="display:inline-block;margin-top:12px;padding:7px 14px;border-radius:99px;border:1px solid rgba(140,210,255,.38);background:rgba(8,16,32,.55);color:#9fd8ff;font-size:11px;font-weight:700;letter-spacing:.04em;text-decoration:none;opacity:.8;pointer-events:auto;line-height:1.3;-webkit-tap-highlight-color:transparent;">🎮 他の脳汁ゲームも遊ぶ（全11本）</a>
  </div>

  <div id="flash"></div>
</div>

<script>
(function(){
"use strict";
var STORE_KEY = "iai-slash-v1";
var HASHTAG = "脳汁ゲー";
var WIN_WINDOW = 0.12;

var stage = document.getElementById("stage");
var cv = document.getElementById("fx");
var ctx = cv.getContext("2d");
var W=0,H=0,DPR=1;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1,2);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize, {passive:true});

/* ---------- audio ---------- */
var actx=null, master=null, noiseBuf=null;
function ensureAudio(){
  if (!actx){
    var AC = window.AudioContext||window.webkitAudioContext;
    if (!AC) return null;
    try{ actx = new AC(); }catch(e){ return null; }
    master = actx.createGain(); master.gain.value = muted?0:0.9; master.connect(actx.destination);
  }
  if (actx.state === "suspended"){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function noise(){
  if (!noiseBuf && actx){
    var len = Math.floor(actx.sampleRate*1.0);
    noiseBuf = actx.createBuffer(1,len,actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
  }
  return noiseBuf;
}
function tone(o){
  if (!actx || muted) return;
  var t0 = actx.currentTime + (o.at||0), dur = o.dur||0.2;
  var osc = actx.createOscillator(); osc.type = o.type||"sine";
  osc.frequency.setValueAtTime(Math.max(1,o.f0), t0);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t0+dur);
  var node=osc;
  if (o.filter){ var f=actx.createBiquadFilter(); f.type=o.filter; f.frequency.value=o.freq||1600; f.Q.value=o.q||1; osc.connect(f); node=f; }
  var g=actx.createGain(); var peak=(o.gain==null?0.2:o.gain);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+(o.attack||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  node.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function noiseBurst(dur, freq, gain, ftype, sweepTo, at){
  if (!actx || muted) return;
  var t0 = actx.currentTime + (at||0);
  var src = actx.createBufferSource(); src.buffer = noise(); src.loop = true;
  var f = actx.createBiquadFilter(); f.type = ftype||"bandpass";
  f.frequency.setValueAtTime(freq,t0);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,sweepTo), t0+dur);
  f.Q.value = 1.4;
  var g = actx.createGain(); g.gain.setValueAtTime(Math.max(0.0002,gain),t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0+dur+0.03);
}
function vibrate(p){ if (navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

var droneOsc=null, droneGain=null;
function startDrone(){
  if (!actx || muted) return;
  stopDrone();
  droneOsc = actx.createOscillator(); droneOsc.type="sine"; droneOsc.frequency.value=55;
  droneGain = actx.createGain(); droneGain.gain.value=0.0001;
  droneOsc.connect(droneGain); droneGain.connect(master);
  droneOsc.start();
  droneGain.gain.exponentialRampToValueAtTime(0.05, actx.currentTime+0.7);
}
function stopDrone(){
  if (!droneOsc) return;
  try{
    var o=droneOsc, g=droneGain;
    if (actx && g) g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.08);
    setTimeout(function(){ try{ o.stop(); }catch(e){} }, 300);
  }catch(e){}
  droneOsc=null; droneGain=null;
}
function sfxSignal(){
  tone({type:"square", f0:1600, f1:900, dur:0.10, gain:0.14});
  noiseBurst(0.12, 5000, 0.18, "highpass", 2500);
  vibrate([0,30,20,40]);
}
function sfxSlice(){
  noiseBurst(0.12, 8000, 0.32, "highpass", 2500);
  tone({type:"sawtooth", f0:2400, f1:220, dur:0.18, gain:0.16});
}
function sfxKiun(){
  var seq=[1046,1318,1568,2093,2637,3136];
  for (var i=0;i<seq.length;i++){
    tone({type:"square", f0:seq[i], dur:0.085, gain:0.09, at:i*0.055});
    tone({type:"sine", f0:seq[i]*2, dur:0.075, gain:0.05, at:i*0.055});
  }
  tone({type:"sine", f0:2093, f1:4186, dur:0.4, gain:0.1, at:0.36});
}
function sfxDeath(){
  tone({type:"sine", f0:140, f1:30, dur:0.8, gain:0.5});
  noiseBurst(0.6, 900, 0.28, "lowpass", 120);
}
function sfxWin(){
  tone({type:"triangle", f0:523, dur:0.16, gain:0.13});
  tone({type:"triangle", f0:784, dur:0.2, gain:0.12, at:0.1});
  tone({type:"triangle", f0:1046, dur:0.3, gain:0.12, at:0.22});
}
function sfxUI(){ ensureAudio(); tone({type:"square", f0:880, f1:1320, dur:0.06, gain:0.07}); }

/* ---------- state ---------- */
var phase = "title";  // title | intro | wait | signal | cut | hit | dead | result
var round = 0;        // 0..4
var wins = 0, kills = 0, perfect = 0;
var reacts = [];
var signalAt = 0, tapAt = 0, reaction = 0;
var waitStart = 0, signalDelay = 0, feintAt = 0;
var tGlobal = 0, shake = 0, hitstop = 0, slowmo = 0;
var particles = [], halves = [], slashes = [], petals = [];
var enemy = null, playerCut = false;
var flash = document.getElementById("flash");
var banner = document.getElementById("banner");
var bannerTx = banner.querySelector(".tx");
var calli = document.getElementById("calligraphy");
var reactionEl = document.getElementById("reaction");
var hint = document.getElementById("hint");
var hud = document.getElementById("hud");
var dotsEl = document.getElementById("dots");
var roundTxt = document.getElementById("roundTxt");
var muted=false;
try{ muted = localStorage.getItem(STORE_KEY+"-muted")==="1"; }catch(e){}
function saveMuted(){ try{ localStorage.setItem(STORE_KEY+"-muted", muted?"1":"0"); }catch(e){} }

var OPPONENTS = [
  {name:"浪人・黒鉄", color:"#ff6f8f", speed:1.00, line:"「上等だ…」"},
  {name:"女剣士・雪乃", color:"#ffb3c7", speed:1.12, line:"「雪のように斬る」"},
  {name:"侍・不知火", color:"#ffcf5c", speed:1.24, line:"「火を纏え」"},
  {name:"剣鬼・羅刹", color:"#ff4d4d", speed:1.38, line:"「喰らえ」"},
  {name:"剣聖・無明", color:"#e8dcff", speed:1.55, line:"「無に帰れ」"}
];

var groundY = 0;
function layout(){ groundY = H*0.80; }
window.addEventListener("resize", function(){ resize(); layout(); }, {passive:true});

/* ---------- flow ---------- */
function resetAll(){
  round = 0; wins = 0; kills = 0; perfect = 0; reacts = [];
  particles=[]; halves=[]; slashes=[]; petals=[];
  shake=0; hitstop=0; slowmo=0; playerCut=false;
  buildDots();
}
function buildDots(){
  dotsEl.innerHTML = "";
  for (var i=0;i<5;i++){
    var d = document.createElement("i");
    d.className = "dot" + (i<round ? (i<kills?" win":" lose") : (i===round?" now":""));
    dotsEl.appendChild(d);
  }
  roundTxt.textContent = Math.min(5,round+1) + " / 5";
}
function startGame(){
  ensureAudio();
  resetAll();
  document.getElementById("scrTitle").classList.remove("show");
  document.getElementById("scrResult").classList.remove("show");
  hud.classList.remove("off");
  layout();
  startRound();
}

function startRound(){
  enemy = OPPONENTS[round];
  buildDots();
  phase = "intro";
  hint.style.opacity = 1;
  hint.textContent = enemy.name;
  bannerTx.textContent = enemy.name + "　" + enemy.line;
  banner.classList.remove("on"); void banner.offsetWidth; banner.classList.add("on");
  startDrone();
  setTimeout(function(){
    if (phase !== "intro") return;
    phase = "wait";
    waitStart = performance.now();
    hint.textContent = "合図を待て…";
    signalDelay = (700 + Math.random()*1500) / enemy.speed;
    feintAt = 300 + Math.random()*Math.max(200, signalDelay-450);
  }, 1400);
}

function goSignal(){
  phase = "signal";
  signalAt = performance.now();
  hint.textContent = "今だッ！！";
  sfxSignal();
  flash.classList.remove("on","rain","red"); void flash.offsetWidth; flash.classList.add("red","on");
  shake = 10;
}

function tap(ev){
  if (phase === "wait"){
    falseStart();
    return;
  }
  if (phase === "signal"){
    tapAt = performance.now();
    reaction = (tapAt - signalAt) / 1000;
    judge();
  }
}
function falseStart(){
  phase = "dead";
  stopDrone();
  hint.textContent = "お手付き…";
  showBanner("お手付き — 合図前に斬った");
  sfxDeath();
  vibrate([0,80,60,120]);
  flash.classList.remove("on","rain","red"); void flash.offsetWidth; flash.classList.add("red","on");
  playerCut = true;
  // 敵の斬撃
  slashes.push({x:W*0.30, y:groundY-90, a:-0.7, t:0, life:0.5, len:W*0.9});
  for (var i=0;i<26;i++){
    particles.push({x:W*0.30, y:groundY-90, vx:(Math.random()-0.3)*420, vy:(Math.random()-0.6)*420,
      life:0.5+Math.random()*0.6, t:0, size:2+Math.random()*4, hue:350, g:520});
  }
  setTimeout(showResult, 1500);
}
function judge(){
  stopDrone();
  var ms = Math.round(reaction*1000);
  if (reaction <= WIN_WINDOW){
    // 神速
    phase = "cut";
    perfect++;
    kills++;
    wins++;
    reacts.push(ms);
    sfxKiun();
    setTimeout(sfxSlice, 120);
    flash.classList.remove("on","red","rain"); void flash.offsetWidth; flash.classList.add("rain","on");
    hitstop = 0.16; slowmo = 0.9; shake = 22;
    vibrate([0,30,30,60,30,100]);
    setCalli("斬");
    showReaction(ms, "#8fe8ff");
    hint.textContent = "神速 " + ms + "ms！！";
    // 斬撃
    startSlash(true);
    setTimeout(function(){
      // 敵を真っ二つに
      splitEnemy();
    }, 140);
    setTimeout(nextRoundOrFinish, 1750);
  } else if (reaction <= 0.34){
    // 辛勝
    phase = "cut";
    kills++; wins++;
    reacts.push(ms);
    sfxSlice();
    flash.classList.remove("on","red","rain"); void flash.offsetWidth; flash.classList.add("on");
    hitstop = 0.08; shake = 14;
    vibrate([0,20,20,30]);
    setCalli("斬");
    showReaction(ms, "#ffe600");
    hint.textContent = "辛勝 " + ms + "ms";
    startSlash(false);
    setTimeout(splitEnemy, 120);
    setTimeout(nextRoundOrFinish, 1600);
  } else {
    // 遅すぎ → 斬られる
    phase = "dead";
    playerCut = true;
    sfxDeath();
    vibrate([0,90,60,130]);
    flash.classList.remove("on","rain","red"); void flash.offsetWidth; flash.classList.add("red","on");
    showBanner("遅ぇ…斬られた");
    setCalli("敗");
    slashes.push({x:W*0.30, y:groundY-90, a:-0.65, t:0, life:0.5, len:W*0.9});
    for (var i=0;i<20;i++){
      particles.push({x:W*0.30,y:groundY-90,vx:(Math.random()-0.4)*400,vy:(Math.random()-0.6)*380,
        life:0.5+Math.random()*0.5,t:0,size:2+Math.random()*4,hue:350,g:520});
    }
    setTimeout(showResult, 1600);
  }
}

function startSlash(isPerfect){
  var x0 = W*0.12, y0 = groundY-40;
  var x1 = W*0.92, y1 = groundY-240;
  slashes.push({x0:x0,y0:y0,x1:x1,y1:y1,t:0,life:0.5,perfect:isPerfect});
  for (var i=0;i<30;i++){
    var k = Math.random();
    particles.push({x:x0+(x1-x0)*k, y:y0+(y1-y0)*k,
      vx:(Math.random()-0.5)*360, vy:(Math.random()-0.5)*360,
      life:0.35+Math.random()*0.7, t:0, size:1.5+Math.random()*4,
      hue:isPerfect? (Math.random()<0.5?190:320) : 45, g:420});
  }
}

function splitEnemy(){
  if (!enemy) return;
  var ex = W*0.70, ey = groundY-95;
  halves.push({x:ex,y:ey,vy:-260,vx:-120,rot:0,vr:-3.4,t:0,color:enemy.color,upper:true});
  halves.push({x:ex,y:ey,vy:-200,vx:160,rot:0,vr:2.8,t:0,color:enemy.color,upper:false});
  for (var i=0;i<44;i++){
    var a = Math.random()*Math.PI*2, sp = 60+Math.random()*520;
    particles.push({x:ex,y:ey,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,
      life:0.6+Math.random()*1.0,t:0,size:2+Math.random()*5,
      hue: (Math.random()<0.75?350:0), g:600});
  }
  for (var p=0;p<16;p++){
    petals.push({x:ex+(Math.random()-0.5)*120, y:ey+(Math.random()-0.5)*80,
      vx:(Math.random()-0.5)*160, vy:-40-Math.random()*120, rot:Math.random()*6,
      vr:(Math.random()-0.5)*6, t:0, life:1.6+Math.random()});
  }
  enemy = null;
}

function showResult(){
  phase = "result";
  stopDrone();
  hud.classList.add("off");
  hint.style.opacity = 0;
  var avg = reacts.length ? reacts.reduce(function(a,b){return a+b;},0)/reacts.length : 0;
  var best = reacts.length ? Math.min.apply(null, reacts) : 0;
  var rank, comment;
  if (wins === 0){ rank = "斬られる前の男"; comment = "合図前に斬ってしまいました。まずは静かに待つこと。"; }
  else if (wins < 5){ rank = "道半ばの侍"; comment = "あと少し。呼吸を整えて、赤い光だけを見ろ。"; }
  else if (avg <= 115){ rank = "剣聖・神域"; comment = "0.1秒の壁を越えました。もはや人間の反応速度ではありません。"; }
  else if (avg <= 135){ rank = "剣豪"; comment = "超高速。相手からは光しか見えていないはず。"; }
  else if (avg <= 165){ rank = "居合の達人"; comment = "見事な太刀筋。実戦でも通用する速さです。"; }
  else if (avg <= 210){ rank = "一人前の侍"; comment = "しっかり斬れています。あと数十msで達人の域。"; }
  else { rank = "修行中の身"; comment = "まだ刀が重い。画面の赤を見た瞬間に指を動かせ。"; }
  document.getElementById("rAvg").innerHTML = (avg/1000).toFixed(3) + "<small>s</small>";
  document.getElementById("rRank").textContent = rank;

  document.getElementById("rKills").textContent = wins + " / 5";
  document.getElementById("rPerfect").textContent = perfect;

  document.getElementById("scrResult").classList.add("show");

}

var src=null;

/* ---------- render ---------- */
function drawBackground(t){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0d0210");
  g.addColorStop(0.55,"#170310");
  g.addColorStop(1,"#05010a");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 月
  var mx = W*0.76, my = H*0.19, mr = W*0.17;
  var mg = ctx.createRadialGradient(mx,my,mr*0.2,mx,my,mr*1.6);
  mg.addColorStop(0,"rgba(255,245,235,.98)");
  mg.addColorStop(0.42,"rgba(255,240,225,.35)");
  mg.addColorStop(1,"rgba(255,200,180,0)");
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx,my,mr*1.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,250,245,.95)";
  ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(210,180,170,.30)";
  ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.2,mr*0.22,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.25,my+mr*0.3,mr*0.16,0,Math.PI*2); ctx.fill();

  // 遠景の山
  ctx.fillStyle = "rgba(30,8,26,.85)";
  ctx.beginPath(); ctx.moveTo(0,groundY-60);
  for (var i=0;i<=8;i++){
    var x = i*W/8;
    var y = groundY - 60 - (i%2===0? 40+((i*37)%60) : 10);
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,groundY); ctx.lineTo(0,groundY); ctx.closePath(); ctx.fill();

  // 竹林
  for (var b=0;b<14;b++){
    var bx = (b*113 + 20) % W;
    var bh = 90 + (b*53)%140;
    ctx.strokeStyle = "rgba(40,90,60,.45)"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(bx, groundY); ctx.quadraticCurveTo(bx+Math.sin(t*0.6+b)*8, groundY-bh*0.6, bx+Math.sin(t*0.5+b)*16, groundY-bh); ctx.stroke();
  }

  // 地面
  var gg = ctx.createLinearGradient(0,groundY,0,H);
  gg.addColorStop(0,"#1a0a18"); gg.addColorStop(1,"#05010a");
  ctx.fillStyle = gg; ctx.fillRect(0,groundY,W,H-groundY);
  ctx.strokeStyle = "rgba(255,120,150,.22)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();

  // 霧
  ctx.save();
  ctx.globalAlpha = 0.10;
  for (var f=0;f<3;f++){
    var fy = groundY - 20 - f*26;
    var fx = (t*18*(f+1)) % (W*1.2);
    ctx.fillStyle = "rgba(220,180,200,1)";
    ctx.beginPath(); ctx.ellipse(fx-100, fy, W*0.5, 16, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawSwordsman(x, y, facing, color, lean, swordUp, dead){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(facing*1.45, 1.45);
  var bounce = Math.sin(tGlobal*2 + x)*1.5;
  if (!dead) ctx.translate(0, bounce);

  // 影
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.beginPath(); ctx.ellipse(0, 2, 34, 7, 0, 0, Math.PI*2); ctx.fill();

  // 足
  ctx.strokeStyle = "#1b1526"; ctx.lineWidth = 9; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-4,2); ctx.lineTo(-14,30); ctx.moveTo(6,2); ctx.lineTo(16,30); ctx.stroke();
  // 草鞋
  ctx.fillStyle = "#3a2c1e";
  ctx.beginPath(); ctx.ellipse(-15,31,8,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(17,31,8,3.5,0,0,Math.PI*2); ctx.fill();

  // 袴（広がる）
  var hg = ctx.createLinearGradient(0,0,0,34);
  hg.addColorStop(0,"#2a2140"); hg.addColorStop(1,"#161020");
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(-16,4); ctx.lineTo(16,4);
  ctx.quadraticCurveTo(26,26, 28,34);
  ctx.lineTo(6,34); ctx.lineTo(0,20); ctx.lineTo(-6,34); ctx.lineTo(-28,34);
  ctx.quadraticCurveTo(-26,26,-16,4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1.2; ctx.stroke();

  // 胴（着物）
  ctx.save();
  ctx.rotate(lean);
  var bg = ctx.createLinearGradient(-18,-34,18,4);
  bg.addColorStop(0,"#3b3058"); bg.addColorStop(0.55,"#251c38"); bg.addColorStop(1,"#150f22");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-17,2); ctx.quadraticCurveTo(-22,-24,0,-33);
  ctx.quadraticCurveTo(22,-24,17,2); ctx.closePath(); ctx.fill();
  // 襟
  ctx.strokeStyle = "#efe6d8"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-7,-30); ctx.lineTo(0,-10); ctx.lineTo(7,-30); ctx.stroke();
  // 帯
  ctx.fillStyle = color;
  ctx.fillRect(-16,-4,32,6);
  ctx.globalAlpha = .5; ctx.fillRect(-16,-4,32,2); ctx.globalAlpha = 1;
  // リムライト
  ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.globalAlpha = .75;
  ctx.beginPath(); ctx.moveTo(-17,2); ctx.quadraticCurveTo(-22,-24,0,-33); ctx.stroke();
  ctx.globalAlpha = 1;

  // 腕 + 刀
  var ay = swordUp ? -50 : -8;
  ctx.strokeStyle = "#2b2240"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(6,-16); ctx.quadraticCurveTo(20,-28, 24, ay); ctx.stroke();
  // 手
  ctx.fillStyle = "#e8cfae";
  ctx.beginPath(); ctx.arc(24, ay, 4, 0, Math.PI*2); ctx.fill();
  // 刀
  ctx.save();
  ctx.translate(24, ay);
  ctx.rotate(swordUp ? -0.62 : 0.34);
  ctx.strokeStyle = "#e9f6ff"; ctx.lineWidth = 3.4;
  ctx.shadowColor = swordUp ? "#9fe8ff" : "rgba(200,220,255,.6)";
  ctx.shadowBlur = swordUp ? 22 : 6;
  ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(52, 0); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#b9933f"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,4); ctx.stroke();
  ctx.strokeStyle = "#2b1d12"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(2,0); ctx.stroke();
  ctx.restore();

  // 頭
  ctx.fillStyle = "#e8cfae";
  ctx.beginPath(); ctx.arc(0,-42,10.5,0,Math.PI*2); ctx.fill();
  // 髷
  ctx.fillStyle = "#12101a";
  ctx.beginPath(); ctx.arc(0,-50,9,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2,-56,5,3,-0.3,0,Math.PI*2); ctx.fill();
  // 顔の影
  ctx.fillStyle = "rgba(40,20,30,.35)";
  ctx.beginPath(); ctx.arc(-4,-41,7,0,Math.PI*2); ctx.fill();
  // 目
  ctx.fillStyle = "#ff2a4d";
  ctx.fillRect(1,-43,7,2.2);
  // 鉢巻
  ctx.fillStyle = color;
  ctx.fillRect(-11,-48,22,4.6);
  ctx.beginPath(); ctx.moveTo(-11,-46); ctx.lineTo(-24,-40); ctx.lineTo(-22,-51); ctx.closePath(); ctx.fill();

  ctx.restore();  // lean
  ctx.restore();
}

function drawEnemy(){
  if (!enemy && halves.length===0) return;
  var ex = W*0.70, ey = groundY;
  var lean = phase==="signal" ? -0.16 : (phase==="wait" ? -0.05 : 0);
  if (enemy) drawSwordsman(ex, ey, -1, enemy.color, lean, phase==="cut", false);
}

function drawHalves(){
  for (var i=0;i<halves.length;i++){
    var h = halves[i];
    ctx.save();
    ctx.translate(h.x, h.y + (h.upper?-40:40));
    ctx.rotate(h.rot);
    ctx.beginPath();
    if (h.upper) ctx.rect(-120,-220,240,220); else ctx.rect(-120,0,240,220);
    ctx.clip();
    ctx.translate(-h.x, -(h.y + (h.upper?-40:40)));
    drawSwordsman(h.x, h.y, -1, h.color, 0, false, true);
    ctx.restore();
  }
}

function drawParticles(){
  ctx.save();
  for (var i=0;i<particles.length;i++){
    var p = particles[i];
    var k = Math.max(0, 1-p.t/p.life);
    ctx.globalAlpha = k;
    ctx.fillStyle = "hsl("+p.hue+",100%,"+(58+30*k)+"%)";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.5+0.9*k),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (var pe=0;pe<petals.length;pe++){
    var q = petals[pe];
    var kk = Math.max(0, 1-q.t/q.life);
    ctx.save();
    ctx.globalAlpha = kk;
    ctx.translate(q.x,q.y); ctx.rotate(q.rot);
    ctx.fillStyle = "rgba(255,150,190,.9)";
    ctx.beginPath(); ctx.ellipse(0,0,6,3,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawSlashes(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (var i=0;i<slashes.length;i++){
    var s = slashes[i];
    var k = s.t/s.life;
    ctx.globalAlpha = Math.max(0, 1-k);
    ctx.strokeStyle = s.perfect ? "rgba(200,250,255,1)" : "rgba(255,240,200,1)";
    ctx.lineWidth = (s.perfect?9:6)*(1-k*0.7);
    ctx.shadowColor = s.perfect? "#7bf0ff":"#ffe600"; ctx.shadowBlur = 24;
    ctx.beginPath();
    if (s.x1!=null) { ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); }
    else { ctx.moveTo(s.x-s.len/2, s.y-s.len*0.18); ctx.lineTo(s.x+s.len/2, s.y+s.len*0.18); }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function loop(now){
  var dt = Math.min(0.05, (now-lastFrame)/1000 || 0.016);
  lastFrame = now;
  tGlobal += dt;

  if (hitstop > 0){ hitstop -= dt; dt *= 0.08; }
  else if (slowmo > 0){ slowmo -= dt; dt *= 0.45; }

  if (phase === "wait"){
    var el = performance.now() - waitStart;
    if (el >= feintAt && !window.__feinted){
      window.__feinted = true;
      // フェイント（攻撃予備動作だけ）
      tone({type:"triangle", f0:300, f1:180, dur:0.08, gain:0.07});
    }
    if (el >= signalDelay) { window.__feinted = false; goSignal(); }
  } else if (phase === "signal"){
    if ((performance.now() - signalAt)/1000 > 0.55){
      // 反応なし → 斬られる
      phase = "dead";
      playerCut = true;
      stopDrone();
      sfxDeath();
      flash.classList.remove("on","rain","red"); void flash.offsetWidth; flash.classList.add("red","on");
      showBanner("動けず…斬られた");
      setCalli("敗");
      slashes.push({x:W*0.30,y:groundY-90,a:-0.65,t:0,life:0.5,len:W*0.9});
      setTimeout(showResult, 1500);
    }
  }

  // 更新
  for (var i=particles.length-1;i>=0;i--){
    var p = particles[i]; p.t += dt; p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.t>=p.life) particles.splice(i,1);
  }
  for (var h=halves.length-1;h>=0;h--){
    var hf = halves[h]; hf.t += dt; hf.vy += 900*dt; hf.x += hf.vx*dt; hf.y += hf.vy*dt; hf.rot += hf.vr*dt;
    if (hf.y > H+400) halves.splice(h,1);
  }
  for (var s=slashes.length-1;s>=0;s--){
    slashes[s].t += dt; if (slashes[s].t>=slashes[s].life) slashes.splice(s,1);
  }
  for (var pe=petals.length-1;pe>=0;pe--){
    var q=petals[pe]; q.t += dt; q.vy += 60*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.rot += q.vr*dt;
    if (q.t>=q.life) petals.splice(pe,1);
  }
  shake *= Math.pow(0.004, dt);

  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBackground(tGlobal);
  if (phase !== "title"){
    // プレイヤー
    var pLean = phase==="cut" ? 0.22 : (phase==="dead" && playerCut ? 0.5 : 0);
    if (!(phase==="dead" && playerCut)) drawSwordsman(W*0.30, groundY, 1, "#7ad7ff", pLean, phase==="cut", false);
    drawEnemy();
    drawHalves();
    drawSlashes();
    drawParticles();
  }
  ctx.restore();

  // 赤いビネット（シグナル中）
  if (phase === "signal"){
    var g = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.7);
    g.addColorStop(0,"rgba(255,0,40,0)");
    g.addColorStop(1,"rgba(255,0,40,"+(0.20+0.16*Math.sin(tGlobal*40))+")");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // 「!!」
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline="middle";
    var pulse = 1 + 0.12*Math.sin(tGlobal*40);
    ctx.font = "900 " + Math.round(Math.min(W,H)*0.34*pulse) + "px 'Hiragino Sans',sans-serif";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#ff0030"; ctx.shadowBlur = 40;
    ctx.fillText("!!", W*0.5, H*0.36);
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

/* ---------- debug ---------- */
window.GAME = {
  state: function(){
    return { phase: phase, round: round, wins: wins, kills: kills, perfect: perfect,
      signal: phase === "signal", reaction: reaction, reacts: reacts.slice(),
      waitLeft: phase==="wait" ? Math.max(0, signalDelay-(performance.now()-waitStart)) : 0 };
  },
  start: startGame,
  tapNow: function(){ tap({}); },
  debugSignal: function(){ window.__feinted=true; if (phase==="wait") goSignal(); },
  debugSlash: function(ms){ if (phase==="signal" || phase==="wait"){ if (phase==="wait") goSignal(); signalAt = performance.now() - (ms||60); tap({}); } },
  debugFinish: function(){ if (phase!=="result") showResult(); }
};

/* ---------- boot ---------- */
var lastFrame = 0;
resize(); layout();
buildDots();
requestAnimationFrame(function(t){ lastFrame=t; loop(t); });
})();
</script>
<script src="../ads.js" defer></script>
