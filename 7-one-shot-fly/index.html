<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>一撃どこまで吹っ飛ぶか｜長押しロケットマッチョ</title>
<meta name="description" content="長押しでパワーを溜めて、パチンコ演出からロケットマッチョを一撃発射。ビル・山・雲・成層圏・月・火星をぶち抜いて何km飛ぶか競え。">
<meta name="theme-color" content="#05010e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一撃フライ">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#05010e;color:#eaf6ff;overflow:hidden;
    overscroll-behavior:none;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  #hud{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:flex-start;justify-content:space-between;
    gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 0 14px;pointer-events:none;transition:opacity .25s;}
  #hud.off{opacity:0;}
  .hud-item{display:flex;flex-direction:column;gap:2px;min-width:86px;}
  .hud-item.right{align-items:flex-end;}
  .lbl{font-size:9px;letter-spacing:.24em;color:#7c90b8;font-weight:700;}
  .hud-val{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(0,229,255,.5);line-height:1.15;}
  .hud-val small{font-size:11px;color:#8fd6ff;margin-left:2px;}
  #hudHits{color:#ff8af5;font-size:16px;}
  #muteBtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);color:#9fd8ff;font-size:15px;display:flex;align-items:center;justify-content:center;}
  #muteBtn:active{transform:scale(.92);}

  .screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:calc(64px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity .22s;background:radial-gradient(ellipse at 50% 42%,rgba(50,10,90,.6) 0%,rgba(5,1,14,.93) 62%,#05010e 100%);}
  .screen.show{opacity:1;pointer-events:auto;}
  .logo{text-align:center;line-height:1;margin-bottom:6px;}
  .logo .l1{display:block;font-size:clamp(13px,4.2vw,18px);letter-spacing:.34em;color:#8fd6ff;font-weight:800;text-indent:.34em;}
  .logo .l2{display:block;margin-top:6px;font-size:clamp(54px,17vw,84px);font-weight:900;line-height:1;
    background:linear-gradient(180deg,#fff 0%,#ffe600 55%,#ff7a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,180,0,.5));}
  .logo .l2b{display:block;margin-top:2px;font-size:clamp(21px,7vw,30px);font-weight:900;letter-spacing:.01em;
    background:linear-gradient(90deg,#ffe600,#ff8a00 60%,#ff2fd0);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,150,0,.45));}
  .logo .l3{display:block;margin-top:10px;font-size:11px;letter-spacing:.42em;color:#ff8af5;font-weight:700;text-indent:.42em;}
  .rules{font-size:12px;line-height:1.8;color:#a9c3e0;text-align:center;background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 16px;max-width:330px;}
  .rules b{color:#ffe600;}
  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:16px;padding:16px 42px;
    font-size:17px;letter-spacing:.05em;background:linear-gradient(135deg,#ff8a00,#ff2fd0 55%,#7b2bff);color:#fff;
    box-shadow:0 10px 34px rgba(255,120,0,.4),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .08s;}
  .btn:active{transform:scale(.95);}
  .btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);box-shadow:none;color:#cfe6ff;font-size:14px;padding:13px 30px;}
  .btn.share{background:linear-gradient(135deg,#101820,#000);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 26px rgba(0,0,0,.5);font-size:15px;padding:14px 30px;}

  #rDist{font-size:clamp(48px,15vw,76px);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(180deg,#fff,#ffe600 60%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,190,0,.55));}
  #rDist small{font-size:.34em;-webkit-text-fill-color:#8fd6ff;margin-left:4px;}
  #rRank{font-size:19px;font-weight:900;color:#ff8af5;text-shadow:0 0 18px rgba(255,47,208,.6);text-align:center;}
  #rStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:330px;}
  .stat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 4px;text-align:center;}
  .stat .k{font-size:9px;color:#7f95b8;letter-spacing:.1em;font-weight:700;}
  .stat .v{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px;}
  #rComment{font-size:12px;color:#a9c3e0;text-align:center;max-width:320px;line-height:1.7;min-height:34px;}

  /* charge UI */
  #charge{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;
    padding:0 20px;opacity:0;transition:opacity .2s;pointer-events:none;}
  #charge.on{opacity:1;}
  #chargeTop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;}
  #chargeLbl{font-size:10px;letter-spacing:.2em;color:#8fd6ff;font-weight:800;}
  #chargePct{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:#ffe600;text-shadow:0 0 14px rgba(255,230,0,.7);}
  #gauge{height:16px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);overflow:hidden;position:relative;}
  #gaugeFill{height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,#00e5ff,#ffe600 55%,#ff2a4d);
    box-shadow:0 0 18px rgba(255,230,0,.7);transition:width .04s linear;}
  #gaugeSweet{position:absolute;top:0;bottom:0;left:78%;width:22%;background:rgba(255,255,255,.16);
    border-left:1px solid rgba(255,255,255,.5);}
  #chargeHint{text-align:center;font-size:11px;letter-spacing:.16em;color:#cfe6ff;margin-top:7px;font-weight:700;}

  #cutin{position:absolute;left:0;right:0;top:21%;z-index:7;text-align:center;pointer-events:none;opacity:0;transform:scale(.8);}
  #cutin.show{animation:cutinIn .55s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes cutinIn{0%{opacity:0;transform:scale(.6) rotate(-4deg)}60%{opacity:1;transform:scale(1.08) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  #cutin .box{display:inline-block;padding:12px 26px;border-radius:14px;background:rgba(5,0,15,.82);
    border:2px solid rgba(255,255,255,.4);box-shadow:0 0 40px rgba(255,47,208,.6);}
  #cutin .slot{font-size:12px;letter-spacing:.3em;color:#8fd6ff;font-weight:800;}
  #cutin .word{font-size:clamp(30px,10vw,46px);font-weight:900;letter-spacing:.06em;line-height:1.2;
    background:linear-gradient(180deg,#fff,#ffe600 55%,#ff2a4d);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,180,0,.8));}
  #cutin.atsu .box{border-color:#ff2a4d;box-shadow:0 0 50px rgba(255,42,77,.8);}
  #cutin.seven .box{border-color:#fff;background:linear-gradient(135deg,rgba(120,0,255,.9),rgba(255,0,120,.9));
    animation:sevenPulse .3s linear infinite;}
  @keyframes sevenPulse{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(60deg)}}

  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:8;}
  #flash.on{animation:flashOut .5s ease-out forwards;}
  @keyframes flashOut{0%{opacity:.95}100%{opacity:0}}
  #banner{position:absolute;left:0;right:0;top:22%;z-index:7;text-align:center;pointer-events:none;opacity:0;}
  #banner.on{animation:bannerIn 1.5s ease-out forwards;}
  #banner .tx{display:inline-block;font-size:clamp(20px,6.4vw,30px);font-weight:900;letter-spacing:.08em;color:#fff;
    padding:8px 20px;border-left:3px solid #ffe600;border-right:3px solid #ffe600;background:rgba(0,0,0,.45);
    text-shadow:0 0 16px rgba(255,230,0,.9);}
  @keyframes bannerIn{0%{opacity:0;transform:translateX(-40px)}12%{opacity:1;transform:translateX(0)}
    80%{opacity:1}100%{opacity:0;transform:translateX(20px)}}
  #hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;
    font-size:12px;letter-spacing:.14em;color:#9fb6d8;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;}
  #bestTag{font-size:10px;color:#7f95b8;letter-spacing:.16em;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx"></canvas>

  <div id="hud" class="off">
    <div class="hud-item">
      <div class="lbl">DISTANCE</div>
      <div class="hud-val" id="hudDist">0.0<small>km</small></div>
      <div id="bestTag">自己ベスト —</div>
    </div>
    <div class="hud-item right">
      <button id="muteBtn" aria-label="サウンド切替">🔊</button>
      <div class="lbl" style="margin-top:8px">突破</div>
      <div class="hud-val" id="hudHits">0</div>
    </div>
  </div>

  <div id="hint">画面を長押ししてパワーを溜めろ</div>

  <div id="charge">
    <div id="chargeTop"><span id="chargeLbl">POWER</span><span id="chargePct">0%</span></div>
    <div id="gauge"><div id="gaugeFill"></div><div id="gaugeSweet"></div></div>
    <div id="chargeHint">離して一撃発射</div>
  </div>

  <div id="cutin"><div class="box"><div class="slot">SLOT</div><div class="word">激アツ</div></div></div>
  <div id="banner"><span class="tx"></span></div>

  <div id="scrTitle" class="screen show">
    <div class="logo">
      <span class="l1">ONE SHOT FLY</span>
      <span class="l2">一撃</span>
      <span class="l2b">どこまで吹っ飛ぶか</span>
      <span class="l3">ROOOOCKET MACHO</span>
    </div>
    <div class="rules">
      画面を<b>長押し</b>してパワーを溜め、<br>
      離した瞬間にロケットマッチョを発射！<br>
      溜め中はパチンコ演出が出て<br>
      <b>激アツ</b>／<b>777</b> ならパワー倍増。<br>
      ビル・山・雲・成層圏・月・火星を<br>
      ぶち抜いて何km飛ぶかを競え。
    </div>
    <button class="btn" id="startBtn">溜めてぶっ飛ばす</button>
      <a class="pkl-arcade-link" href="../arcade/" style="display:inline-block;margin-top:12px;padding:7px 14px;border-radius:99px;border:1px solid rgba(140,210,255,.38);background:rgba(8,16,32,.55);color:#9fd8ff;font-size:11px;font-weight:700;letter-spacing:.04em;text-decoration:none;opacity:.8;pointer-events:auto;line-height:1.3;-webkit-tap-highlight-color:transparent;">🎮 他の脳汁ゲームも遊ぶ（全11本）</a>
  </div>

  <div id="scrResult" class="screen">
    <div class="lbl" style="letter-spacing:.34em;color:#8fd6ff">FLY RESULT</div>
    <div id="rDist">0.0<small>km</small></div>
    <div id="rRank">—</div>
    <div id="rStats">
      <div class="stat"><div class="k">ぶち抜き</div><div class="v" id="rHits">0</div></div>
      <div class="stat"><div class="k">最高マッハ</div><div class="v" id="rSpeed">0</div></div>
      <div class="stat"><div class="k">自己ベスト</div><div class="v" id="rBest">0</div></div>
    </div>
    <div id="rComment"></div>
    <button class="btn share" id="shareBtn">𝕏 で飛距離をシェア</button>
    <button class="btn ghost" id="retryBtn">もう一発ぶっ放す</button>
      <a class="pkl-arcade-link" href="../arcade/" style="display:inline-block;margin-top:12px;padding:7px 14px;border-radius:99px;border:1px solid rgba(140,210,255,.38);background:rgba(8,16,32,.55);color:#9fd8ff;font-size:11px;font-weight:700;letter-spacing:.04em;text-decoration:none;opacity:.8;pointer-events:auto;line-height:1.3;-webkit-tap-highlight-color:transparent;">🎮 他の脳汁ゲームも遊ぶ（全11本）</a>
  </div>

  <div id="flash"></div>
</div>

<script>
(function(){
"use strict";

var STORE_KEY = "oneshot-fly-v1";
var PX_PER_KM = 60;
var GRAV = 500;
var HASHTAG = "脳汁ゲー";

var stage = document.getElementById("stage");
var cv = document.getElementById("fx");
var ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = 1;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", function(){ resize(); }, {passive:true});

/* ---------------- storage ---------------- */
var best = 0, muted = false, cutinTimer = 0;
try {
  best = parseFloat(localStorage.getItem(STORE_KEY+"-best")||"0") || 0;
  muted = localStorage.getItem(STORE_KEY+"-muted") === "1";
} catch(e){}
function saveBest(v){ try{ localStorage.setItem(STORE_KEY+"-best", String(v)); }catch(e){} }
function saveMuted(){ try{ localStorage.setItem(STORE_KEY+"-muted", muted?"1":"0"); }catch(e){} }

/* ---------------- audio ---------------- */
var actx=null, master=null, noiseBuf=null;
function ensureAudio(){
  if (!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try{ actx = new AC(); }catch(e){ return null; }
    master = actx.createGain(); master.gain.value = muted?0:0.85; master.connect(actx.destination);
  }
  if (actx.state === "suspended"){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function noise(){
  if (!noiseBuf && actx){
    var len = Math.floor(actx.sampleRate*1.0);
    noiseBuf = actx.createBuffer(1,len,actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
  }
  return noiseBuf;
}
function tone(o){
  if (!actx || muted) return;
  var t0 = actx.currentTime + (o.at||0), dur = o.dur||0.2;
  var osc = actx.createOscillator(); osc.type = o.type||"sine";
  osc.frequency.setValueAtTime(Math.max(1,o.f0), t0);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t0+dur);
  var node = osc;
  if (o.filter){ var f=actx.createBiquadFilter(); f.type=o.filter; f.frequency.value=o.freq||1600; f.Q.value=o.q||1; osc.connect(f); node=f; }
  var g = actx.createGain(); var peak=(o.gain==null?0.2:o.gain);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+(o.attack||0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  node.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0+dur+0.04);
}
function noiseBurst(dur, freq, gain, ftype, sweepTo, at){
  if (!actx || muted) return;
  var t0 = actx.currentTime + (at||0);
  var src = actx.createBufferSource(); src.buffer = noise(); src.loop = true;
  var f = actx.createBiquadFilter(); f.type = ftype||"lowpass";
  f.frequency.setValueAtTime(freq,t0);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,sweepTo), t0+dur);
  f.Q.value = 0.9;
  var g = actx.createGain(); g.gain.setValueAtTime(Math.max(0.0002,gain),t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0+dur+0.04);
}
function vibrate(p){ if (navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

var chargeOsc=null, chargeGain=null, chargeFilter=null;
function startChargeSound(){
  if (!actx || muted) return;
  stopChargeSound();
  chargeOsc = actx.createOscillator(); chargeOsc.type = "sawtooth";
  chargeOsc.frequency.value = 90;
  chargeFilter = actx.createBiquadFilter(); chargeFilter.type="lowpass"; chargeFilter.frequency.value=500; chargeFilter.Q.value=6;
  chargeGain = actx.createGain(); chargeGain.gain.value = 0.0001;
  chargeOsc.connect(chargeFilter); chargeFilter.connect(chargeGain); chargeGain.connect(master);
  chargeOsc.start();
  chargeGain.gain.exponentialRampToValueAtTime(0.05, actx.currentTime+0.2);
}
function updateChargeSound(p){
  if (!chargeOsc || !actx) return;
  var f = 90 + p*520;
  chargeOsc.frequency.setTargetAtTime(f, actx.currentTime, 0.03);
  if (chargeFilter) chargeFilter.frequency.setTargetAtTime(400 + p*2600, actx.currentTime, 0.05);
  if (chargeGain) chargeGain.gain.setTargetAtTime(0.03 + p*0.05, actx.currentTime, 0.05);
}
function stopChargeSound(){
  if (!chargeOsc) return;
  try{
    var o = chargeOsc, g = chargeGain;
    if (actx && g){ g.gain.cancelScheduledValues(actx.currentTime); g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.02); }
    setTimeout(function(){ try{ o.stop(); }catch(e){} }, 120);
  }catch(e){}
  chargeOsc = null; chargeGain = null; chargeFilter = null;
}
function sfxLaunch(p){
  tone({type:"sawtooth", f0:120, f1:1800, dur:0.45, gain:0.22, filter:"lowpass", freq:3200});
  noiseBurst(0.6, 2600, 0.35, "lowpass", 200);
  tone({type:"sine", f0:80, f1:38, dur:0.7, gain:0.45});
  if (p > 0.8) tone({type:"square", f0:1046, f1:2093, dur:0.25, gain:0.08, at:0.05});
}
function sfxBreak(kind){
  if (kind === "moon" || kind === "mars" || kind === "galaxy"){
    tone({type:"sine", f0:70, f1:28, dur:0.9, gain:0.5});
    noiseBurst(1.1, 1600, 0.35, "lowpass", 90);
    tone({type:"square", f0:220, f1:55, dur:0.5, gain:0.12});
  } else {
    noiseBurst(0.22, 3200, 0.3, "lowpass", 300);
    tone({type:"square", f0:180, f1:60, dur:0.18, gain:0.18});
  }
}
function sfxKiun(){
  var seq=[1046,1318,1568,2093,2637,3136];
  for (var i=0;i<seq.length;i++){
    tone({type:"square", f0:seq[i], dur:0.09, gain:0.09, at:i*0.06});
    tone({type:"sine", f0:seq[i]*2, dur:0.08, gain:0.045, at:i*0.06});
  }
}
function sfxLand(){
  tone({type:"sine", f0:120, f1:32, dur:0.55, gain:0.5});
  noiseBurst(0.5, 1200, 0.3, "lowpass", 100);
}
function sfxUI(){ ensureAudio(); tone({type:"square", f0:880, f1:1320, dur:0.06, gain:0.07}); }

/* ---------------- state ---------------- */
var phase = "title"; // title|ready|charge|fly|result
var p = 0, charging = false, chargeT = 0, cutinDone = false, cutMul = 1, cutType = "normal";
var shot = null; // {vx,vy0,T,t,x,y,alt,power}
var obstacles = [], debris = [], sparks = [], texts = [], stars = [], rings = [];
var camX = 0, camY = 0, camTX = 0, camTY = 0;
var hits = 0, maxSpeed = 0, distKm = 0, shake = 0, hitstop = 0, flashWhite = 0;
var lastFrame = 0, bgT = 0, landed = false;
var launchX = 0, launchY = 0;
var milestone = [0,0,0,0];

var hud = document.getElementById("hud");
var elDist = document.getElementById("hudDist");
var elHits = document.getElementById("hudHits");
var elBest = document.getElementById("bestTag");
var chargeEl = document.getElementById("charge");
var gaugeFill = document.getElementById("gaugeFill");
var chargePct = document.getElementById("chargePct");
var chargeHint = document.getElementById("chargeHint");
var hint = document.getElementById("hint");
var cutin = document.getElementById("cutin");
var cutinWord = cutin.querySelector(".word");
var banner = document.getElementById("banner");
var bannerTx = banner.querySelector(".tx");
var flash = document.getElementById("flash");

function fmtKm(v){ return v.toFixed(1); }
function fmtNum(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

if (best) elBest.textContent = "自己ベスト " + fmtKm(best) + "km";

/* ---------------- world ---------------- */
function resetWorld(){
  obstacles = []; debris = []; sparks = []; texts = []; stars = []; rings = [];
  hits = 0; maxSpeed = 0; distKm = 0; shake = 0; hitstop = 0; landed = false;
  camX = 0; camY = 0; camTX = 0; camTY = 0;
  elHits.textContent = "0";
  elDist.innerHTML = "0.0<small>km</small>";
  milestone = [0,0,0,0];
  for (var i=0;i<90;i++){
    stars.push({x:Math.random()*4000, y:-Math.random()*3400, r:Math.random()*1.8+0.5, tw:Math.random()*6.28});
  }
}

function beginReady(){
  phase = "ready";
  p = 0; charging = false; chargeT = 0; cutinDone = false; cutMul = 1;
  resetWorld();
  launchX = 0; launchY = 0;
  camX = -W*0.22; camY = -H*0.72;
  hint.textContent = "画面を長押ししてパワーを溜めろ";
  hint.style.opacity = 1;
  hud.classList.remove("off");
  chargeEl.classList.remove("on");
  chargeHint.textContent = "離して一撃発射";
}

function hideCutin(){ cutin.className = ""; }

function chooseCutin(){
  var r = Math.random();
  if (r < 0.14){ cutType = "seven"; cutMul = 1.65; cutinWord.textContent = "777"; }
  else if (r < 0.48){ cutType = "atsu"; cutMul = 1.3; cutinWord.textContent = "激アツ"; }
  else { cutType = "normal"; cutMul = 1.0; cutinWord.textContent = "チャンス"; }
  cutin.className = "";
  void cutin.offsetWidth;
  cutin.className = "show" + (cutType==="seven"?" seven":(cutType==="atsu"?" atsu":""));
  cutin.querySelector(".slot").textContent = cutType==="seven" ? "確 定" : "SLOT";
  clearTimeout(cutinTimer);
  cutinTimer = setTimeout(hideCutin, 1700);
  if (cutType === "seven"){ sfxKiun(); vibrate([0,30,40,60,40,100]); flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on"); }
  else if (cutType === "atsu"){ tone({type:"square", f0:660, f1:990, dur:0.18, gain:0.1}); vibrate([0,20]); }
  else { tone({type:"triangle", f0:440, dur:0.12, gain:0.06}); }
}

function launch(){
  var power = Math.min(1, p/100);
  var eff = Math.min(1.55, Math.max(0.05, power) * cutMul);
  var chicken = chargeT < 0.12;
  if (chicken) eff = 0.05;

  var vx, vy0;
  if (chicken){ vx = 40; vy0 = -170; }
  else { vx = 500 + 900*eff; vy0 = -(600 + 520*eff); }
  var T = (-vy0*2)/GRAV;
  shot = { vx:vx, vy0:vy0, T:T, t:0, x:launchX, y:launchY, power:power, eff:eff, angle:0, spin:0, chicken:chicken };
  hideCutin();
  if (chicken) showBanner("チキンショット…");
  phase = "fly";
  charging = false;
  chargeEl.classList.remove("on");
  stopChargeSound();
  sfxLaunch(eff);
  hitstop = 0.06;
  shake = 14;
  flashWhite = 0.5;
  vibrate([0,40,60,90]);
  // 発射の土煙
  for (var i=0;i<26;i++){
    var a = Math.PI + Math.random()*Math.PI;
    sparks.push({x:launchX, y:launchY, vx:Math.cos(a)*(80+Math.random()*260), vy:Math.sin(a)*(80+Math.random()*260),
      life:0.5+Math.random()*0.5, t:0, size:2+Math.random()*4, hue:38, g:600});
  }
  // 障害物を弾道に沿って配置
  buildObstacles();
  camX = shot.x - W*0.30; camY = shot.y - H*0.52;
  hint.style.opacity = 0;
}

function altAt(t){ return shot.vy0*t + 0.5*GRAV*t*t; } // world y (negative = up)

function buildObstacles(){
  var n = shot.chicken ? 1 : Math.max(4, Math.min(15, 4 + Math.round(shot.eff*11)));
  for (var i=0;i<n;i++){
    var f = 0.12 + i*(0.85/Math.max(1,n-1));
    var t = Math.min(shot.T*0.98, shot.T*f);
    var x = shot.vx*t;
    var y = altAt(t);
    var kind;
    if (f < 0.22) kind = "building";
    else if (f < 0.40) kind = "mountain";
    else if (f < 0.55) kind = "cloud";
    else if (f < 0.70) kind = "plane";
    else if (f < 0.80) kind = "balloon";
    else if (f < 0.90) kind = "moon";
    else if (f < 0.965) kind = "mars";
    else kind = "galaxy";
    var size = kind==="moon"? 150 : kind==="mars"? 120 : kind==="galaxy"? 140 :
               kind==="building"? 70+Math.random()*70 :
               kind==="mountain"? 160+Math.random()*120 : 60+Math.random()*50;
    obstacles.push({ x:x, y:y + (kind==="cloud"? -30 : 0), kind:kind, size:size, broken:false, passed:false,
      rot:(Math.random()-0.5)*0.3, seed:Math.random()*100, wob:Math.random()*6.28 });
  }
}

/* ---------------- input ---------------- */
var src = null;
function inUI(t){ if (!t || !t.closest) return false; return !!t.closest(".screen, #hud, button, .btn"); }
function down(s, ev){
  if (inUI(ev.target)) return false;
  if (phase === "result" || phase === "title") return false;
  if (ev.cancelable){ try{ ev.preventDefault(); }catch(e){} }
  if (src === "touch" && s === "pointer") return false;
  src = s;
  ensureAudio();
  if (phase === "ready" || (phase === "fly" && shot && shot.t < 0.25)) {
    if (phase === "ready") startCharge();
  }
  return true;
}
function up(s){
  if (src !== s) return;
  src = null;
  if (phase === "charge") doRelease();
}
function startCharge(){
  phase = "charge"; charging = true; chargeT = 0; p = 0; cutinDone = false; cutMul = 1;
  chargeEl.classList.add("on");
  chargeHint.textContent = "離して一撃発射";
  hint.style.opacity = 0;
  ensureAudio();
  startChargeSound();
}
function doRelease(){
  charging = false;
  stopChargeSound();
  launch();
}
stage.addEventListener("pointerdown", function(ev){ if (ev.button!=null && ev.button>0) return; down("pointer", ev); }, {passive:false});
window.addEventListener("pointerup", function(){ up("pointer"); }, {passive:true});
window.addEventListener("pointercancel", function(){ up("pointer"); }, {passive:true});
stage.addEventListener("touchstart", function(ev){ if (ev.touches && ev.touches.length>1) return; down("touch", ev); }, {passive:false});
window.addEventListener("touchend", function(ev){ if (ev.touches && ev.touches.length>0) return; up("touch"); }, {passive:true});
window.addEventListener("touchcancel", function(){ up("touch"); }, {passive:true});
window.addEventListener("blur", function(){ up("pointer"); up("touch"); });
document.addEventListener("visibilitychange", function(){ if (document.hidden){ up("pointer"); up("touch"); } });
document.addEventListener("touchmove", function(ev){ if (charging && ev.cancelable){ try{ ev.preventDefault(); }catch(e){} } }, {passive:false});
stage.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });

/* ---------------- update ---------------- */
function showBanner(txt){
  bannerTx.textContent = txt;
  banner.classList.remove("on"); void banner.offsetWidth; banner.classList.add("on");
  tone({type:"triangle", f0:660, f1:990, dur:0.18, gain:0.1});
}

function updateCharge(dt){
  chargeT += dt;
  var speed = 100/1.9;
  p = Math.min(100, p + speed*dt);
  if (!cutinDone && chargeT > 0.55){ cutinDone = true; chooseCutin(); }
  gaugeFill.style.width = p.toFixed(1) + "%";
  chargePct.textContent = Math.round(p) + "%";
  updateChargeSound(p/100);
  if (p >= 100){
    chargeHint.textContent = "MAX! 離して一撃発射";
    if (Math.random() < 0.10) vibrate([0,8]);
  }
}

function updateFly(dt){
  shot.t += dt;
  var t = shot.t;
  shot.x = shot.vx*t;
  shot.y = altAt(Math.min(t, shot.T));
  shot.spin += dt * (4 + shot.eff*6);
  var sp = Math.hypot(shot.vx, shot.vy0 + GRAV*t);
  if (sp > maxSpeed) maxSpeed = sp;

  var km = Math.max(0, shot.x / PX_PER_KM);
  distKm = km;
  elDist.innerHTML = fmtKm(km) + "<small>km</small>";

  // カメラ
  camTX = shot.x - W*0.30;
  camTY = shot.y - H*0.55;
  camX = camTX;
  camY += (camTY - camY) * Math.min(1, dt*26);

  // 軌跡の火花
  if (Math.random() < 0.85){
    sparks.push({x:shot.x, y:shot.y, vx:-shot.vx*0.12 + (Math.random()-0.5)*60, vy:(Math.random()-0.5)*80,
      life:0.25+Math.random()*0.35, t:0, size:1.5+Math.random()*2.5, hue:cutType==="seven"?48:190, g:0});
  }

  // 障害物
  for (var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if (!o.broken && shot.x >= o.x - o.size*0.35){
      o.broken = true;
      breakObstacle(o);
    }
    if (!o.broken && o.x - camX < -300) o.passed = true;
  }

  // マイルストーン
  var ms = [["ビル群 突破！",10],["成層圏 到達！",50],["月をぶち抜き！",120],["火星域 突入！",165]];
  for (var m=0;m<ms.length;m++){
    if (milestone[m]===0 && km>=ms[m][1]){ milestone[m]=1; showBanner(ms[m][0]); }
  }

  if (shot.t >= shot.T){ land(); }
}

function breakObstacle(o){
  hits++;
  elHits.textContent = hits;
  sfxBreak(o.kind);
  shake = Math.min(26, 12 + o.size*0.05);
  hitstop = (o.kind==="moon"||o.kind==="mars"||o.kind==="galaxy") ? 0.11 : 0.045;
  flashWhite = (o.kind==="moon"||o.kind==="mars"||o.kind==="galaxy") ? 0.55 : 0.18;
  vibrate([0,25,20,25]);
  var hue = o.kind==="mars"? 18 : o.kind==="galaxy"? 280 : o.kind==="moon"? 210 : o.kind==="cloud"? 195 : 32;
  for (var i=0;i<18;i++){
    var a = Math.random()*Math.PI*2, sp = 90+Math.random()*430;
    debris.push({x:o.x, y:o.y, vx:Math.cos(a)*sp - 120, vy:Math.sin(a)*sp,
      size:4+Math.random()*16, rot:Math.random()*6, vr:(Math.random()-0.5)*16,
      hue:hue, t:0, life:0.9+Math.random()*1.1});
  }
  texts.push({x:o.x, y:o.y-30, txt:"ぶち抜き！", hue:(o.kind==="moon"?210:38), size:18, t:0, life:0.9, vy:-60});
  rings.push({x:o.x, y:o.y, r:8, max:o.size*1.6, hue:hue, t:0, life:0.45, w:6});
}

function land(){
  if (landed) return;
  landed = true;
  phase = "result";
  sfxLand();
  shake = 20; hitstop = 0.09; flashWhite = 0.4;
  var y0 = 0;
  for (var i=0;i<40;i++){
    var a = -Math.PI/2 + (Math.random()-0.5)*2.6;
    sparks.push({x:shot.x, y:0, vx:Math.cos(a)*(100+Math.random()*380), vy:Math.sin(a)*(-100-Math.random()*420),
      life:0.6+Math.random()*0.8, t:0, size:2+Math.random()*5, hue:30, g:760});
  }
  setTimeout(function(){ showResult(); }, 1100);
}

/* ---------------- result ---------------- */
function showResult(){
  hud.classList.add("off");
  var km = shot.x / PX_PER_KM;
  var isBest = km > best;
  if (isBest){ best = km; saveBest(best); }
  var rank, comment;
  if (km >= 180){ rank = "銀河一撃マッチョ"; comment = "火星の向こうまで一直線。宇宙があなたを恐れています。"; }
  else if (km >= 130){ rank = "月を越えた男"; comment = "月面にあなたの型がつきました。もはや兵器。"; }
  else if (km >= 80){ rank = "成層圏の主"; comment = "飛行機がすれ違う高さ。航空会社から連絡が来そう。"; }
  else if (km >= 40){ rank = "雲の上の人"; comment = "ビルも山も軽々突破。ロケットマッチョの本気。"; }
  else if (km >= 12){ rank = "近所の飛び職人"; comment = "町の上空をひとっ飛び。十分すぎる飛距離です。"; }
  else if (km >= 3){ rank = "ちょい飛びマッチョ"; comment = "惜しい！長押しでゲージをMAXまで溜めるのがコツ。"; }
  else { rank = "置物"; comment = "ほぼ垂直に落ちました。次はしっかり溜めよう。"; }
  document.getElementById("rDist").innerHTML = fmtKm(km) + "<small>km</small>";
  document.getElementById("rRank").textContent = rank;
  document.getElementById("rHits").textContent = hits;
  document.getElementById("rSpeed").textContent = "Mach " + fmtNum(Math.round(maxSpeed/26));
  document.getElementById("rBest").textContent = fmtKm(best) + "km";
  document.getElementById("rComment").textContent = comment + (isBest ? "　🎉自己ベスト更新！" : "");
  document.getElementById("scrResult").classList.add("show");
  vibrate([0,60,50,90]);
}

/* ---------------- render ---------------- */
function skyColors(f){
  // f: 0 ground .. 1 space
  var top = [ [126,206,255], [80,150,240], [24,40,110], [8,6,30], [4,2,12] ];
  var idx = Math.min(3.999, f*4);
  var i0 = Math.floor(idx), k = idx-i0;
  var c0 = top[i0], c1 = top[i0+1];
  return "rgb(" + Math.round(c0[0]+(c1[0]-c0[0])*k) + "," +
                  Math.round(c0[1]+(c1[1]-c0[1])*k) + "," +
                  Math.round(c0[2]+(c1[2]-c0[2])*k) + ")";
}

function drawSky(f){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, skyColors(Math.min(1, f*1.15)));
  g.addColorStop(0.55, skyColors(Math.min(1, f*1.0)));
  g.addColorStop(1, skyColors(Math.min(1, f*0.55)));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  if (f > 0.25){
    ctx.save();
    var a = Math.min(1, (f-0.25)*3);
    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      var x = s.x - camX*0.15, y = s.y - camY*0.15;
      x = ((x % (W+80)) + W+80) % (W+80) - 40;
      y = ((y % (H+80)) + H+80) % (H+80) - 40;
      ctx.globalAlpha = a*(0.35+0.55*Math.abs(Math.sin(bgT*1.3+s.tw)));
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawGround(){
  var gy = 0 - camY;
  if (gy > H+100 || gy < -H) {
    // ground far below
    return;
  }
  var g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, "#2b6b3a");
  g.addColorStop(1, "#0d2a16");
  ctx.fillStyle = g;
  ctx.fillRect(0, gy, W, H-gy+2);
  ctx.strokeStyle = "rgba(180,255,180,.55)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
  // 草むら
  ctx.strokeStyle = "rgba(120,220,140,.35)"; ctx.lineWidth = 2;
  for (var gi=0; gi<40; gi++){
    var gx = (gi*53 - (camX*0.6)%53);
    var gh = 4 + (gi%3)*3;
    ctx.beginPath(); ctx.moveTo(gx, gy+2); ctx.lineTo(gx+2, gy-gh); ctx.stroke();
  }
  // 地面の質感
  ctx.fillStyle = "rgba(255,255,255,.045)";
  for (var di=0; di<30; di++){
    var dx = (di*97 - (camX*0.8)%97);
    var dy = gy + 20 + ((di*37)%Math.max(10,(H-gy-20)));
    ctx.beginPath(); ctx.ellipse(dx, dy, 18, 4, 0, 0, Math.PI*2); ctx.fill();
  }

  // 発射台
  var sx = launchX - camX;
  if (sx > -200 && sx < W+200){
    ctx.fillStyle = "#3a2a1a";
    ctx.beginPath(); ctx.moveTo(sx-70, gy); ctx.lineTo(sx+30, gy-10); ctx.lineTo(sx+30, gy-40); ctx.lineTo(sx-70, gy-16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,200,80,.6)"; ctx.lineWidth = 2; ctx.stroke();
  }
  // 観客
  for (var i=0;i<24;i++){
    var x = ((i*67 - camX*0.5) % (W+120)) - 60;
    var hh = 10 + (i%3)*3;
    ctx.fillStyle = "rgba(10,30,20,.55)";
    ctx.beginPath(); ctx.arc(x, gy-hh, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(x-2.6, gy-hh+2, 5.2, hh+4);
  }
}

function drawBuilding(o){
  var x = o.x - camX, y = o.y - camY;
  var w = o.size, h = Math.max(H*1.6, 900);
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "#1b2b4a";
  ctx.fillRect(-w/2, 0, w, h);
  ctx.strokeStyle = "rgba(120,180,255,.55)"; ctx.lineWidth = 2;
  ctx.strokeRect(-w/2, 0, w, h);
  // 窓
  ctx.fillStyle = "rgba(255,220,120,.55)";
  for (var r=0;r<9;r++) for (var c=0;c<3;c++){
    if ((r*3+c+Math.floor(o.seed))%4===0) continue;
    ctx.fillRect(-w/2+8+c*(w-16)/3, 18+r*34, (w-16)/3-6, 14);
  }
  // アンテナ
  ctx.strokeStyle = "rgba(255,120,200,.7)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-34); ctx.stroke();
  ctx.restore();
}

function drawMountain(o){
  var x = o.x - camX, y = o.y - camY;
  var w = o.size*2.4, h = o.size*1.7;
  ctx.save(); ctx.translate(x,y);
  var g = ctx.createLinearGradient(0,-h,0,0);
  g.addColorStop(0,"#8fb2d8"); g.addColorStop(0.35,"#3d5f86"); g.addColorStop(1,"#122238");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.lineTo(-w*0.12, -h); ctx.lineTo(w*0.2, -h*0.72); ctx.lineTo(w/2, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.beginPath(); ctx.moveTo(-w*0.12,-h); ctx.lineTo(-w*0.02,-h*0.82); ctx.lineTo(-w*0.18,-h*0.86); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCloud(o){
  var x = o.x - camX, y = o.y - camY;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = "rgba(255,255,255,.92)";
  for (var i=0;i<5;i++){
    var a = i*1.3 + o.seed;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*o.size*0.7, Math.sin(a)*o.size*0.25, o.size*(0.45+0.2*Math.sin(a*2)), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(200,225,255,.75)";
  ctx.beginPath(); ctx.ellipse(0, o.size*0.3, o.size*1.1, o.size*0.38, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPlane(o){
  var x = o.x - camX, y = o.y - camY;
  ctx.save(); ctx.translate(x,y); ctx.rotate(-0.1);
  ctx.fillStyle = "#e8f4ff";
  ctx.beginPath(); ctx.ellipse(0,0,o.size*0.9,o.size*0.16,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(-o.size*0.5,0); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-o.size*0.6,o.size*0.45); ctx.lineTo(-o.size*0.3,o.size*0.45); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(120,200,255,.7)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-o.size*0.95,0); ctx.lineTo(-o.size*2.2,0); ctx.stroke();
  ctx.restore();
}

function drawBalloon(o){
  var x = o.x - camX, y = o.y - camY;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = "rgba(255,120,80,.9)";
  ctx.beginPath(); ctx.ellipse(0,0,o.size*0.55,o.size*0.7,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,o.size*0.68); ctx.lineTo(-6,o.size*1.3); ctx.moveTo(0,o.size*0.68); ctx.lineTo(6,o.size*1.3); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.fillRect(-8, o.size*1.3, 16, 10);
  ctx.restore();
}

function drawMoon(o){
  var x = o.x - camX, y = o.y - camY;
  ctx.save(); ctx.translate(x,y);
  var g = ctx.createRadialGradient(-o.size*0.3,-o.size*0.3,o.size*0.1,0,0,o.size);
  g.addColorStop(0,"#f4f7ff"); g.addColorStop(0.6,"#c9d4ea"); g.addColorStop(1,"#8d9bb8");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,o.size,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(120,140,175,.55)";
  var craters=[[-0.3,-0.2,0.14],[0.25,-0.35,0.09],[0.1,0.3,0.17],[-0.42,0.28,0.08],[0.42,0.1,0.06]];
  for (var i=0;i<craters.length;i++){
    var c=craters[i];
    ctx.beginPath(); ctx.arc(c[0]*o.size,c[1]*o.size,c[2]*o.size,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawMars(o){
  var x = o.x - camX, y = o.y - camY;
  ctx.save(); ctx.translate(x,y);
  var g = ctx.createRadialGradient(-o.size*0.3,-o.size*0.3,o.size*0.1,0,0,o.size);
  g.addColorStop(0,"#ff9d6e"); g.addColorStop(0.6,"#d4472a"); g.addColorStop(1,"#8a2412");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,o.size,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,220,200,.8)";
  ctx.beginPath(); ctx.ellipse(0,-o.size*0.86,o.size*0.3,o.size*0.12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(90,20,10,.5)";
  ctx.beginPath(); ctx.arc(o.size*0.3,o.size*0.2,o.size*0.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawGalaxy(o){
  var x = o.x - camX, y = o.y - camY;
  ctx.save(); ctx.translate(x,y); ctx.rotate(bgT*0.3);
  ctx.globalCompositeOperation = "lighter";
  for (var i=0;i<4;i++){
    ctx.strokeStyle = "rgba("+(180+i*10)+","+(120+i*20)+",255,"+(0.5-i*0.08)+")";
    ctx.lineWidth = 14-i*3;
    ctx.beginPath(); ctx.ellipse(0,0,o.size*(0.4+i*0.22), o.size*(0.16+i*0.12), i*0.7, 0, Math.PI*2); ctx.stroke();
  }
  ctx.fillStyle = "#fff";
  for (var k=0;k<16;k++){
    var a=k*2.3, rr=o.size*(0.2+0.7*Math.random());
    ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,1.8+Math.random()*1.6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawEarthCurve(f){
  if (f < 0.45) return;
  var k = Math.min(1, (f-0.45)/0.35);
  var cy = H + H*1.5 - k*H*0.35;
  var rad = W*2.6;
  ctx.save();
  var g = ctx.createRadialGradient(W*0.5, cy, rad*0.9, W*0.5, cy, rad*1.06);
  g.addColorStop(0, "rgba(40,120,255,0)");
  g.addColorStop(0.86, "rgba(60,160,255,"+(0.16*k)+")");
  g.addColorStop(0.93, "rgba(120,210,255,"+(0.42*k)+")");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(W*0.5, cy, rad*1.06, 0, Math.PI*2); ctx.fill();
  // 地表
  var eg = ctx.createRadialGradient(W*0.5, cy-rad*0.02, rad*0.96, W*0.5, cy, rad);
  eg.addColorStop(0, "rgba(8,30,60,0)");
  eg.addColorStop(1, "rgba(4,14,32,"+(0.85*k)+")");
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(W*0.5, cy, rad, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawObstacles(){
  for (var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    var x = o.x - camX;
    if (o.broken || x < -o.size*4 || x > W + o.size*4) continue;
    if (o.kind==="building") drawBuilding(o);
    else if (o.kind==="mountain") drawMountain(o);
    else if (o.kind==="cloud") drawCloud(o);
    else if (o.kind==="plane") drawPlane(o);
    else if (o.kind==="balloon") drawBalloon(o);
    else if (o.kind==="moon") drawMoon(o);
    else if (o.kind==="mars") drawMars(o);
    else drawGalaxy(o);
  }
}

function drawMacho(x, y, angle, scale, chargingP){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angle); ctx.scale(scale,scale);

  /* ---- ロケットパック（背中） ---- */
  ctx.save();
  ctx.fillStyle = "#c9d6e8";
  roundRectPath(-17, -14, 18, 34, 7); ctx.fill();
  ctx.fillStyle = "#8798b4";
  roundRectPath(-15, 8, 14, 8, 3); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();

  /* ---- 炎 ---- */
  if (chargingP > 0.02 || (phase==="fly")){
    var fl = 1 + Math.sin(bgT*42)*0.22;
    var power2 = phase==="charge" ? chargingP : 0.65;
    var len = 22 + 90*power2*fl;
    var fg = ctx.createLinearGradient(0, 26, 0, 26+len);
    fg.addColorStop(0,"rgba(255,255,255,.98)");
    fg.addColorStop(0.35,"rgba(255,220,80,.95)");
    fg.addColorStop(0.7,"rgba(255,110,30,.75)");
    fg.addColorStop(1,"rgba(255,30,10,0)");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-13, 26);
    ctx.quadraticCurveTo(-7, 26+len*0.55, 0, 26+len);
    ctx.quadraticCurveTo(7, 26+len*0.55, 13, 26);
    ctx.closePath(); ctx.fill();
  }

  /* ---- 脚 ---- */
  ctx.strokeStyle = "#f7c79b"; ctx.lineWidth = 10; ctx.lineCap = "round";
  if (phase === "fly"){
    ctx.beginPath(); ctx.moveTo(-6, 14); ctx.lineTo(-20, 30); ctx.moveTo(7, 14); ctx.lineTo(22, 26); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-7, 14); ctx.lineTo(-13, 34); ctx.moveTo(8, 14); ctx.lineTo(15, 34); ctx.stroke();
  }
  // シューズ
  ctx.fillStyle = "#ff2a4d";
  if (phase === "fly"){
    ctx.beginPath(); ctx.ellipse(-22, 31, 9, 5, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(24, 27, 9, 5, 0.4, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(-14, 35, 9, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(16, 35, 9, 5, 0, 0, Math.PI*2); ctx.fill();
  }

  /* ---- パンツ ---- */
  ctx.fillStyle = "#e6273f";
  ctx.beginPath();
  ctx.moveTo(-17, 6); ctx.lineTo(17, 6); ctx.lineTo(15, 19); ctx.lineTo(4, 19);
  ctx.lineTo(0, 13); ctx.lineTo(-4, 19); ctx.lineTo(-15, 19); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffd84d"; ctx.fillRect(-6, 7, 12, 4);

  /* ---- 胴体（逆三角形） ---- */
  var bg = ctx.createLinearGradient(-20,-20,20,14);
  bg.addColorStop(0,"#ffe3c2"); bg.addColorStop(0.45,"#ffc793"); bg.addColorStop(1,"#e08f52");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-21,-14); ctx.quadraticCurveTo(-14,-20,0,-20);
  ctx.quadraticCurveTo(14,-20,21,-14);
  ctx.quadraticCurveTo(16,2,13,7);
  ctx.lineTo(-13,7); ctx.quadraticCurveTo(-16,2,-21,-14);
  ctx.closePath(); ctx.fill();

  /* 胸筋・腹筋 */
  ctx.strokeStyle = "rgba(150,80,40,.5)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-9,-9,8,0.15,2.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(9,-9,8,0.65,3.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,4); ctx.moveTo(-7,2); ctx.lineTo(7,2); ctx.stroke();

  /* ---- 腕 ---- */
  ctx.strokeStyle = "#f7c79b"; ctx.lineWidth = 9;
  var armY = phase === "fly" ? -26 : 4;
  ctx.beginPath();
  ctx.moveTo(-19,-11); ctx.quadraticCurveTo(-29,-18, -27, armY-14);
  ctx.moveTo(19,-11); ctx.quadraticCurveTo(29,-18, 27, armY-14);
  ctx.stroke();
  // 拳
  ctx.fillStyle = "#ffd9b3";
  ctx.beginPath(); ctx.arc(-27, armY-14, 6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(27, armY-14, 6, 0, Math.PI*2); ctx.fill();

  /* ---- 首 ---- */
  ctx.fillStyle = "#f3bd8d";
  ctx.fillRect(-6,-27,12,9);

  /* ---- 頭 ---- */
  ctx.fillStyle = "#ffd9b3";
  ctx.beginPath(); ctx.arc(0,-38,15,0,Math.PI*2); ctx.fill();
  // 耳
  ctx.beginPath(); ctx.arc(-14,-38,3.4,0,Math.PI*2); ctx.arc(14,-38,3.4,0,Math.PI*2); ctx.fill();
  // 鼻
  ctx.fillStyle = "#f0b184";
  ctx.beginPath(); ctx.arc(0,-35,3.2,0,Math.PI*2); ctx.fill();
  // 口
  ctx.strokeStyle = "#9b4a2a"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0,-31,5,0.35,Math.PI-0.35); ctx.stroke();
  // サングラス
  ctx.fillStyle = "#0b1020";
  roundRectPath(-12,-43,24,8,2); ctx.fill();
  ctx.fillStyle = "rgba(90,210,255,.75)";
  ctx.fillRect(-10.5,-41.6,8,4); ctx.fillRect(2.5,-41.6,8,4);
  // 鉢巻
  ctx.fillStyle = "#ff2a4d"; ctx.fillRect(-15,-50,30,6);
  ctx.beginPath(); ctx.moveTo(15,-47); ctx.lineTo(29,-40); ctx.lineTo(27,-52); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-15,-47); ctx.lineTo(-26,-41); ctx.lineTo(-24,-52); ctx.closePath(); ctx.fill();

  /* ---- ほこり ---- */
  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawParticles(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (var ri=0;ri<rings.length;ri++){
    var rg = rings[ri];
    var kk = rg.t/rg.life;
    var rad2 = rg.r + (rg.max-rg.r)*(1-Math.pow(1-kk,3));
    ctx.globalAlpha = Math.max(0, 1-kk);
    ctx.strokeStyle = "hsl("+rg.hue+",100%,72%)";
    ctx.lineWidth = rg.w*(1-kk)+1;
    ctx.beginPath(); ctx.arc(rg.x-camX, rg.y-camY, rad2, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  for (var i=0;i<sparks.length;i++){
    var s = sparks[i];
    var k = 1 - s.t/s.life;
    if (k<=0) continue;
    ctx.globalAlpha = k;
    ctx.fillStyle = "hsl("+s.hue+",100%,"+(60+30*k)+"%)";
    ctx.beginPath(); ctx.arc(s.x-camX, s.y-camY, s.size*(0.6+0.7*k), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (var j=0;j<debris.length;j++){
    var d = debris[j];
    var kk = 1 - d.t/d.life;
    if (kk<=0) continue;
    ctx.save();
    ctx.globalAlpha = kk;
    ctx.translate(d.x-camX, d.y-camY); ctx.rotate(d.rot);
    ctx.fillStyle = "hsl("+d.hue+",85%,55%)";
    ctx.fillRect(-d.size/2,-d.size/3,d.size,d.size*0.66);
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1;
    ctx.strokeRect(-d.size/2,-d.size/3,d.size,d.size*0.66);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  for (var t2=0;t2<texts.length;t2++){
    var tx = texts[t2];
    var a = 1 - tx.t/tx.life;
    if (a<=0) continue;
    ctx.globalAlpha = a;
    ctx.font = "900 "+tx.size+"px 'Hiragino Sans','Noto Sans JP',sans-serif";
    ctx.fillStyle = "hsl("+tx.hue+",100%,72%)";
    ctx.shadowColor = "hsl("+tx.hue+",100%,60%)"; ctx.shadowBlur = 12;
    ctx.fillText(tx.txt, tx.x-camX, tx.y-camY);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawSpeedLines(){
  if (phase !== "fly") return;
  var sp = shot ? shot.vx : 1000;
  ctx.save();
  for (var i=0;i<26;i++){
    var seed = i*137.5;
    var y = (seed + bgT*300) % (H+80) - 40;
    var travel = (bgT*sp*1.6 + seed*3) % (W*1.6);
    var x = W + 60 - travel;
    var len = 26 + (i%4)*26;
    var alpha = 0.10 + 0.22*((i%5)/5);
    ctx.strokeStyle = shot && shot.eff > 1.2 ? "rgba(255,225,120,"+alpha+")" : "rgba(200,235,255,"+alpha+")";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+len, y); ctx.stroke();
  }
  ctx.restore();
}

function drawAimScene(){
  var gy = 0 - camY;
  // 街並み
  for (var i=0;i<9;i++){
    var x = i*90 - (camX%90) - 60;
    var h = 60 + ((i*53)%120);
    ctx.fillStyle = "rgba(30,50,90,.85)";
    ctx.fillRect(x, gy-h, 64, h);
    ctx.fillStyle = "rgba(255,220,120,.35)";
    for (var r=0;r<4;r++) for (var c=0;c<2;c++){
      if ((i+r+c)%3===0) continue;
      ctx.fillRect(x+9+c*26, gy-h+12+r*20, 14, 9);
    }
  }
  // マッチョ
  var mx = launchX - camX, my = launchY - camY - 42;
  var bob = Math.sin(bgT*3)*1.5;
  drawMacho(mx, my+bob, 0, 1.45, phase==="charge"?p/100:0);
}

function loop(now){
  var dt = Math.min(0.045, (now-lastFrame)/1000 || 0.016);
  lastFrame = now;
  bgT += dt;

  if (hitstop > 0){ hitstop -= dt; dt = 0; }

  if (phase === "charge") updateCharge(dt);
  else if (phase === "fly") updateFly(dt);

  // パーティクル更新
  for (var i=sparks.length-1;i>=0;i--){
    var s = sparks[i]; s.t += dt; s.vy += s.g*dt; s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.t>=s.life) sparks.splice(i,1);
  }
  for (var j=debris.length-1;j>=0;j--){
    var d = debris[j]; d.t += dt; d.vy += 520*dt; d.x += d.vx*dt; d.y += d.vy*dt; d.rot += d.vr*dt;
    if (d.t>=d.life) debris.splice(j,1);
  }
  for (var ri=rings.length-1;ri>=0;ri--){
    var rg = rings[ri]; rg.t += dt;
    if (rg.t >= rg.life) rings.splice(ri,1);
  }
  for (var k=texts.length-1;k>=0;k--){
    var tx = texts[k]; tx.t += dt; tx.y += tx.vy*dt;
    if (tx.t>=tx.life) texts.splice(k,1);
  }
  shake *= Math.pow(0.004, dt);

  var f = 0;
  if (shot && phase !== "title"){
    f = Math.min(1, Math.max(0, -shot.y / 2200));
  } else {
    f = 0;
  }

  ctx.save();
  if (shake > 0.4) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawSky(f);
  if (phase === "ready" || phase === "charge"){
    drawGround();
    drawAimScene();
  } else if (phase === "fly" || phase === "result"){
    drawGround();
    drawEarthCurve(f);
    drawObstacles();
    // マッチョ
    if (shot){
      var mx = shot.x - camX, my = shot.y - camY;
      if (landed) my = 0 - camY - 10;
      drawMacho(mx, my, shot.spin, 1.35, 1);
    }
    drawSpeedLines();
  }
  drawParticles();
  ctx.restore();

  // 高度ビネット
  if (shot && phase !== "title"){
    var vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.8);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,"rgba(0,0,0,"+(0.35+f*0.3)+")");
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }

  if (flashWhite > 0.01){
    ctx.save();
    ctx.globalAlpha = Math.min(0.85, flashWhite);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    flashWhite *= Math.pow(0.02, dt);
  }
  requestAnimationFrame(loop);
}

/* ---------------- UI ---------------- */
function bindTap(el, fn){
  el.addEventListener("click", function(ev){
    if (el.__lt && performance.now()-el.__lt < 700) return;
    fn(ev);
  });
  el.addEventListener("touchend", function(ev){ el.__lt = performance.now(); ev.preventDefault(); fn(ev); }, {passive:false});
}
function startFromTitle(){
  sfxUI();
  document.getElementById("scrTitle").classList.remove("show");
  document.getElementById("scrResult").classList.remove("show");
  beginReady();
  ensureAudio();
}
bindTap(document.getElementById("startBtn"), startFromTitle);
bindTap(document.getElementById("retryBtn"), startFromTitle);
bindTap(document.getElementById("shareBtn"), function(){
  sfxUI();
  var km = shot ? shot.x/PX_PER_KM : 0;
  var text = "一撃どこまで吹っ飛ぶか、で " + fmtKm(km) + "km！\n"
           + "ぶち抜き " + hits + "個／最高 Mach " + fmtNum(Math.round(maxSpeed/26)) + "\n"
           + "ロケットマッチョはどこまで飛ぶ？";
  var url = /^https?:/.test(location.protocol) ? location.href.split("#")[0] : "";
  var u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text)
        + (url ? "&url=" + encodeURIComponent(url) : "")
        + "&hashtags=" + encodeURIComponent(HASHTAG);
  window.open(u, "_blank");
});
document.getElementById("muteBtn").addEventListener("click", function(){
  ensureAudio(); muted = !muted;
  if (master) master.gain.value = muted?0:0.85;
  document.getElementById("muteBtn").textContent = muted ? "🔇":"🔊";
  saveMuted();
  if (!muted) sfxUI();
});
document.getElementById("muteBtn").textContent = muted ? "🔇":"🔊";

/* ---------------- debug API ---------------- */
window.GAME = {
  state: function(){
    return { phase: phase, power: Math.round(p), charging: charging, cutinDone: cutinDone, cutType: cutType,
      hits: hits, km: shot ? Math.round(shot.x/PX_PER_KM*10)/10 : 0,
      t: shot ? Math.round(shot.t*100)/100 : 0, landed: landed, best: best,
      obstacles: obstacles.length,
      body: shot ? {x:Math.round(shot.x-camX), y:Math.round(shot.y-camY)} : null,
      cam: {x:Math.round(camX), y:Math.round(camY)},
      obx: obstacles.map(function(o){return Math.round(o.x-camX);}) };
  },
  start: function(){ document.getElementById("scrTitle").classList.remove("show"); beginReady(); },
  setPower: function(v){ if (phase==="charge"){ p = Math.max(0,Math.min(100,v)); } },
  release: function(){ if (phase==="charge") doRelease(); },
  finish: function(){ if (phase==="fly") { shot.t = shot.T; } if (phase==="charge") doRelease(); },
  jump: function(t){ if (shot){ shot.t = Math.max(0, Math.min(shot.T, t)); } },
  setPower: function(v){ if (phase==="charge"){ p = Math.max(0, Math.min(100,v)); } }
};

/* ---------------- boot ---------------- */
resize();
resetWorld();
requestAnimationFrame(function(t){ lastFrame = t; loop(t); });
})();
</script>
